<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c5ce7"><title>CampusAttend</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f2ff;--card:#fff;--tx:#1e1b3a;--mu:#7a7899;--bd:#e8e5fa;--pr:#6c5ce7;--ok:#10b981;--okb:#d1fae5;--er:#ef4444;--erb:#fee2e2;--wa:#f59e0b;--wab:#fef3c7;--sh:0 4px 20px rgba(108,92,231,.10);--g:linear-gradient(135deg,#6c5ce7,#a855f7 60%,#ec4899)}

</style></head><body>
<div class="mainc"><div class="wrap"><section class="view" id="v-home">
<div class="hero"><div><small id="gr"></small><h1>Hi, <span id="hi"></span> 👋</h1><p>Institution overview</p></div><div class="av" id="av"></div></div>
<div class="pull"><div id="st" class="grid"></div></div><div class="card"><h3>Pending requests</h3><div class="row" style="border:0"><span id="pc" class="mu"></span><button class="btn s" onclick="go('app')">Review</button></div></div></section>

<section class="view" id="v-set"><h2>Settings</h2><div class="card"><h3>Attendance threshold</h3><label>Minimum % required</label><input id="th" type="number" value="75"><button class="btn w" onclick="saveTh()">Save</button></div><div class="card"><h3>Reports</h3><button class="btn gh w" onclick="csv()">Download CSV report</button></div><div id="pf"></div></section></div></div><nav id="nav" class="tabbar"></nav><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>

if(DEMO){(()=>{const K="ca_demo_v1",ls=localStorage,now=()=>Math.floor(Date.now()/1e3),L=[];
const seed=()=>{const db={},cr={},T=()=>({__ts:now()});
const u=(id,n,em,pw,role,no,sec,st)=>{db["users/"+id]={name:n,email:em,idNo:no,role,section:sec,status:st||"approved",createdAt:T()};cr[em]={pw,uid:id}};
u("admin1","Admin Sharma","admin@demo.com","admin123","admin","ADM001","");u("prof1","Prof. Verma","prof@demo.com","prof123","teacher","FAC101","");
u("stu1","Rohan Gupta","student@demo.com","student123","student","CS21001","CSE-A");u("stu2","Priya Singh","priya@demo.com","student123","student","CS21002","CSE-A");
u("stu3","Aman Yadav","aman@demo.com","student123","student","CS21003","CSE-A","pending");u("prof2","Prof. Mishra","mishra@demo.com","prof123","teacher","FAC102","","pending");
db["settings/main"]={threshold:75};
for(const[sid,nm,ns,p1,p2]of[["s1","Data Structures",10,8,9],["s2","DBMS",8,5,7]]){db["subjects/"+sid]={name:nm,section:"CSE-A",teacherUid:"prof1"};
for(let i=1;i<=ns;i++){const id=sid+"_"+i;db["sessions/"+id]={subjectId:sid,teacherUid:"prof1",codeHash:"x",status:"closed",createdAt:{__ts:now()-86400*(ns-i+1)}};
if(i<=p1)db["records/"+id+"_stu1"]={sessionId:id,subjectId:sid,uid:"stu1",name:"Rohan Gupta",status:"present",method:"self-checkin",at:T()};
if(i<=p2)db["records/"+id+"_stu2"]={sessionId:id,subjectId:sid,uid:"stu2",name:"Priya Singh",status:"present",method:"self-checkin",at:T()}}}
return{db,cr}};
if(!ls.getItem(K))ls.setItem(K,JSON.stringify(seed()));
const st=()=>JSON.parse(ls.getItem(K)),save=s=>ls.setItem(K,JSON.stringify(s)),fire=()=>L.forEach(f=>f());addEventListener("storage",fire);
const rd=o=>{const r={};for(const k in o){const v=o[k];r[k]=v&&v.__ts?{seconds:v.__ts,toDate:()=>new Date(v.__ts*1e3)}:v}return r};
const wr=o=>{const r={};for(const k in o)r[k]=o[k]==="__TS__"?{__ts:now()}:o[k];return r};
const ds=(p,id)=>{const v=st().db[p];return{id,exists:!!v,data:()=>v&&rd(v)}};
const run=(n,f)=>{const s=st(),docs=Object.keys(s.db).filter(p=>p.startsWith(n+"/")&&p.indexOf("/",n.length+1)<0).map(p=>ds(p,p.slice(n.length+1))).filter(d=>f.every(([k,v])=>d.data()[k]===v));return{docs,size:docs.length,empty:!docs.length}};
const Q=(n,f)=>({where:(k,o,v)=>Q(n,[...f,[k,v]]),get:async()=>run(n,f),add:async d=>{const id="d"+Math.random().toString(36).slice(2,10);await D.doc(n+"/"+id).set(d);return{id}},
onSnapshot:cb=>{const fn=()=>cb(run(n,f));fn();L.push(fn);return()=>L.splice(L.indexOf(fn),1)}});
D={doc:p=>({get:async()=>ds(p,p.split("/").pop()),set:async d=>{const s=st();s.db[p]=wr(d);save(s);fire()},update:async d=>{const s=st();s.db[p]={...s.db[p],...wr(d)};save(s);fire()}}),collection:n=>Q(n,[]),runTransaction:async f=>f({get:r=>r.get(),set:(r,d)=>r.set(d)})};
A={onAuthStateChanged:cb=>{const u=ls.getItem("ca_uid");setTimeout(()=>cb(u?{uid:u}:null),0)},
signInWithEmailAndPassword:async(em,pw)=>{const c=st().cr[em.toLowerCase()];if(!c||c.pw!==pw)throw Error("Invalid email or password");ls.setItem("ca_uid",c.uid);return{user:{uid:c.uid}}},
createUserWithEmailAndPassword:async(em,pw)=>{const s=st(),k=em.toLowerCase();if(s.cr[k])throw Error("Email already registered");const uid="u"+Math.random().toString(36).slice(2,9);s.cr[k]={pw,uid};save(s);ls.setItem("ca_uid",uid);return{user:{uid,delete:async()=>{const s=st();delete s.cr[k];save(s);ls.removeItem("ca_uid")}}}},
signOut:async()=>ls.removeItem("ca_uid"),sendPasswordResetEmail:async()=>{}};TS="__TS__"})()}
else{firebase.initializeApp(CFG);A=firebase.auth();D=firebase.firestore();TS=firebase.firestore.FieldValue.serverTimestamp()}
const $=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const toast=t=>{const x=$("#toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2600)};
const hash=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const IC={home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',check:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14l-3-3"/>',chart:'<path d="M12 20V10M18 20V4M6 20v-4"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/>',live:'<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.5M7.8 16.2a6 6 0 0 1 0-8.4M19 4.9a10 10 0 0 1 0 14.2M5 19.1a10 10 0 0 1 0-14.2"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+IC[n]+'</svg>';
const go=id=>{document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id=="v-"+id));document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.id=="t-"+id));scrollTo(0,0)};
const shell=it=>{$("#nav").innerHTML='<div class="lg"><span class="ico">'+ic("check")+'</span>CampusAttend</div>'+it.map(x=>'<button id="t-'+x[0]+'" onclick="go(\''+x[0]+'\')">'+ic(x[2])+x[1]+'</button>').join("");go(it[0][0])};
const out=()=>A.signOut().then(()=>location="index.html");
const prof=d=>$("#pf").innerHTML='<div class="card" style="text-align:center"><div class="av" style="margin:auto;background:var(--g);width:76px;height:76px;font-size:30px">'+e(d.name[0])+'</div><h2 style="margin:12px 0 2px">'+e(d.name)+'</h2><div class="mu">'+e(d.email)+'</div><p><span class="tag pr">'+({student:"Student",teacher:"Professor",admin:"Admin"})[d.role]+'</span> <span class="tag">ID '+e(d.idNo||"-")+'</span>'+(d.section?' <span class="tag wa">'+e(d.section)+'</span>':'')+'</p></div><button class="btn er w" onclick="out()">'+ic("out")+' Logout</button>';
const guard=(role,cb)=>A.onAuthStateChanged(async u=>{if(!u)return location="index.html";const d=(await D.doc("users/"+u.uid).get()).data();if(!d||d.role!==role||d.status!=="approved")return location="index.html";
const h=new Date().getHours();$("#gr").textContent=h<12?"Good morning":h<17?"Good afternoon":"Good evening";$("#hi").textContent=d.name.split(" ")[0];$("#av").textContent=d.name[0].toUpperCase();prof(d);cb(u,d)});
let U,S,SE,R;shell([["home","Home","home"],["app","Approvals","users"],["sub","Subjects","book"],["set","Settings","set"]]);guard("admin",()=>load());
async function load(){const g=c=>D.collection(c).get().then(q=>q.docs.map(d=>({id:d.id,...d.data()})));
[U,S,SE,R]=await Promise.all([g("users"),g("subjects"),g("sessions"),g("records")]);
const th=await D.doc("settings/main").get();if(th.exists)$("#th").value=th.data().threshold;
const n=r=>U.filter(u=>u.role==r&&u.status=="approved").length,nm=id=>(U.find(u=>u.id==id)||{}).name||"-",pe=U.filter(u=>u.status=="pending");
$("#st").innerHTML=[["Students",n("student"),"users"],["Professors",n("teacher"),"user"],["Subjects",S.length,"book"],["Sessions",SE.length,"chart"]].map(x=>'<div class="card stat"><span class="ico">'+ic(x[2])+'</span><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("");
$("#pc").textContent=pe.length+" account(s) waiting";const t=$("#t-app");t.querySelector("b")?.remove();if(pe.length)t.insertAdjacentHTML("beforeend","<b>"+pe.length+"</b>");
$("#pend").innerHTML=pe.map(u=>'<div class="row"><div><b>'+e(u.name)+'</b><div class="mu">'+(u.role=="teacher"?"Professor":"Student")+' · '+e(u.idNo)+' '+e(u.section||"")+'</div></div><div><button class="btn ok s" onclick="setS(\''+u.id+'\',\'approved\')">Approve</button> <button class="btn er s" onclick="setS(\''+u.id+'\',\'rejected\')">Reject</button></div></div>').join("")||'<div class="empty">All caught up ✓</div>';
$("#st2").innerHTML=U.filter(u=>u.role=="teacher"&&u.status=="approved").map(u=>'<option value="'+u.id+'">'+e(u.name)+'</option>').join("");
$("#subs").innerHTML=S.map(s=>'<div class="row"><b>'+e(s.name)+'</b><span><span class="tag pr">'+e(s.section)+'</span> <span class="mu">'+e(nm(s.teacherUid))+'</span></span></div>').join("")||'<div class="empty">No subjects yet</div>'}
const setS=(id,s)=>D.doc("users/"+id).update({status:s}).then(()=>{toast("Updated");load()});
const saveTh=()=>D.doc("settings/main").set({threshold:+$("#th").value}).then(()=>toast("Threshold saved"));
const addSub=()=>{if(!$("#sn").value||!$("#ss").value||!$("#st2").value)return toast("Fill all fields");D.collection("subjects").add({name:$("#sn").value.trim(),section:$("#ss").value.trim(),teacherUid:$("#st2").value}).then(()=>{$("#sn").value="";toast("Subject added");load()})};
function csv(){const th=+$("#th").value,rows=[["ID","Name","Section","Subject","Conducted","Present","Percent","Below threshold"]];
S.forEach(s=>{const c=SE.filter(x=>x.subjectId==s.id).length;U.filter(u=>u.role=="student"&&u.status=="approved"&&u.section==s.section).forEach(u=>{const p=R.filter(r=>r.uid==u.id&&r.subjectId==s.id).length,pc=c?(p/c*100).toFixed(1):"0";rows.push([u.idNo,u.name,u.section,s.name,c,p,pc,+pc<th?"YES":"no"])})});
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));a.download="attendance-report.csv";a.click()}
</script></body></html>
