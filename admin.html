<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#A81D16">
<title>Admin · CampusAttend</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#D3261D;--btn:#C8221A;--bg:#F6F3F2;--s:#fff;--s2:#FAF6F5;--ink:#1D1816;--ink2:#645B58;--ink3:#857B78;--line:#EAE3E1;--ok:#14804F;--oks:#E2F4EB;--warn:#9A5800;--warns:#FFF1D6;--bad:#B3261E;--bads:#FCE9E7;--sh:0 1px 2px rgba(70,20,15,.06),0 8px 24px rgba(70,20,15,.08);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--brand:#F0584E;--btn:#CF3128;--bg:#120E0E;--s:#1D1717;--s2:#251D1D;--ink:#F6EFED;--ink2:#BDB0AC;--ink3:#9A8D89;--line:#332828;--ok:#3DD598;--oks:#14302A;--warn:#F5B547;--warns:#352A12;--bad:#FF8379;--bads:#3A1E1B;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
.top{background:linear-gradient(135deg,#BC2018,#85120D);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;font-weight:700;flex:1}.top p{font-size:12px;opacity:.88;font-weight:400}
.top button{background:rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px}
nav{position:sticky;top:0;z-index:10;background:var(--s);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:9px 14px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
nav button.on{background:color-mix(in srgb,var(--brand) 12%,var(--s));color:var(--brand)}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px}
main{max-width:960px;margin:0 auto;padding:16px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.stat span{font-size:12.5px;color:var(--ink2)}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .grow{flex:1;min-width:140px}.card b{display:block;font-size:14.5px}.card small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.acts{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--brand) 12%,var(--s));color:var(--brand);flex:none}
.chip{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s2);color:var(--ink2);border:1px solid var(--line)}
.chip.ok{background:var(--oks);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warns);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bads);color:var(--bad);border-color:transparent}
.b{padding:8px 13px;border-radius:11px;font-weight:700;font-size:13px;background:var(--s2);border:1px solid var(--line)}
.b.p{background:var(--btn);color:#fff;border-color:var(--btn)}.b.ok{background:var(--oks);color:var(--ok);border-color:transparent}.b.d{background:var(--bads);color:var(--bad);border-color:transparent}
.b[disabled]{opacity:.5;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.in{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--s);padding:0 12px;outline:none;width:100%}
textarea.in{padding:10px 12px;min-height:90px;resize:vertical}
.in:focus{border-color:var(--brand)}
.tools .in{flex:1;min-width:160px;width:auto}
.fchips{display:flex;gap:6px;flex-wrap:wrap}.fchips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--s);font-weight:700;font-size:12.5px;color:var(--ink2)}
.fchips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.form{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;margin-bottom:14px;box-shadow:var(--sh)}
.form h2{font-size:15px}.form label>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 5px 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.two{grid-template-columns:1fr}}
.dc{position:relative}.dc input{position:absolute;opacity:0;inset:0}.dc span{display:block;padding:8px 12px;border-radius:11px;border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--ink2);background:var(--s);margin:0!important}
.dc input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.sect{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.empty{text-align:center;padding:30px 16px;color:var(--ink2);background:var(--s);border:1px dashed var(--line);border-radius:16px}.empty b{display:block;color:var(--ink);margin-bottom:3px}
.warnbox{background:var(--warns);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.note p{font-size:13px;color:var(--ink2);white-space:pre-wrap;width:100%}
#login{max-width:360px;margin:12vh auto;padding:0 16px;display:grid;gap:12px}#login h1{font-size:22px}#err{color:var(--bad);font-size:13.5px;min-height:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50;padding:0 16px}
.toast{background:#241816;color:#fff;border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.toast.bad{background:#7d1812}
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,8,6,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.dlg{background:var(--s);border-radius:20px;padding:18px;max-width:440px;width:100%;display:grid;gap:10px;box-shadow:var(--sh)}
.dlg h3{font-size:17px}.dlg .wn{background:var(--warns);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}.dlg .wn.bad{background:var(--bads);color:var(--bad)}
.dlg ul{margin:0 0 0 18px;font-size:13.5px;color:var(--ink2)}.dlg .dis{font-size:12px;color:var(--ink3);line-height:1.4}
.dlg .ck{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:600}.dlg .ck input{margin-top:3px;width:18px;height:18px;flex:none}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<form id="login"><h1>Admin sign in</h1><p style="color:var(--ink2)">CampusAttend · CSJMU Kanpur</p><input class="in" id="em" type="email" placeholder="Email" autocomplete="username" required><input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="b p" style="min-height:46px">Sign in</button><div id="err" role="alert"></div></form>
<div id="app" hidden>
  <header class="top"><h1>Admin<p>CampusAttend · CSJMU Kanpur</p></h1><button id="out">Sign out</button></header>
  <nav id="tabs" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="fb-guard.js"></script>
<script type="module" src="fb-teacher.js"></script>
<script type="module">
const F=FBT.f,db=FBT.db,$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D={teachers:[],students:[],classes:[],enrollments:[],cohorts:[],announcements:[]};
const S={tab:'overview',q:'',f:'all'},DAYS=['','Mon','Tue','Wed','Thu','Fri','Sat'];
let started=false,cur=null,errCode='',LIVE=[],liveErr='',lastSig='';
const ST={pending:'warn',approved:'ok',active:'ok',rejected:'bad',terminated:'bad'};
const chip=s=>'<span class="chip '+(ST[s]||'')+'">'+esc(s)+'</span>';
const ini=n=>String(n||'?').replace(/^(Dr|Prof)\.?\s+/i,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const cname=id=>(D.cohorts.find(c=>c.id===id)||{}).name||id;
const card=(n,sub,st,acts,extra)=>'<div class="card note"><span class="av">'+esc(ini(n))+'</span><div class="grow"><b>'+esc(n)+'</b><small>'+esc(sub)+'</small></div>'+(st?chip(st):'')+(extra||'')+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
const B=(attrs,label,cls)=>'<button class="b '+(cls||'')+'" '+attrs+'>'+label+'</button>';
const setB=(col,id,st,label,cls)=>B('data-set="'+col+'" data-id="'+id+'" data-st="'+st+'"',label,cls);
const delB=(col,id)=>B('data-del="'+col+'" data-id="'+id+'"','Delete','d');
const empty=(t,s)=>'<div class="empty"><b>'+t+'</b>'+s+'</div>';
const toast=(m,bad)=>{const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2800)};
const fail=e=>toast('Failed: '+(e.code||e.message),1);
const hit=(r,keys)=>!S.q||keys.some(k=>String(r[k]||'').toLowerCase().includes(S.q.toLowerCase()));
const pf=r=>r.status==='pending'?0:1;
const search=ph=>'<input class="in" id="q" type="search" placeholder="'+ph+'" value="'+esc(S.q)+'" aria-label="'+ph+'">';
const fchips=(arr)=>'<div class="fchips">'+arr.map(a=>'<button data-f="'+a+'" class="'+(S.f===a?'on':'')+'">'+a[0].toUpperCase()+a.slice(1)+'</button>').join('')+'</div>';
const cohortOpts=(all)=>(all?'<option value="all">All cohorts</option>':'<option value="">Select cohort</option>')+D.cohorts.map(c=>'<option value="'+esc(c.id)+'"'+(S.f===c.id?' selected':'')+'>'+esc(c.name||c.id)+'</option>').join('');
const nStu=c=>D.students.filter(s=>s.cohort===c&&s.status==='active').length;
const ms=a=>a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
const mins=t=>{const m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||'');return m?((+m[1]%12)+(/PM/i.test(m[3])?12:0))*60+ +m[2]:0};
const to12=v=>{const a=String(v||'10:00').split(':').map(Number);return((a[0]%12)||12)+':'+String(a[1]||0).padStart(2,'0')+' '+(a[0]<12?'AM':'PM')};
const FULL=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const loadScript=(u,g)=>new Promise((ok,no)=>{if(window[g])return ok();const x=document.createElement('script');x.src=u;x.onload=ok;x.onerror=()=>no(new Error('Could not load library. Check internet.'));document.head.appendChild(x)});
const csvOut=rows=>rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
const dl=(n,t)=>{const b=new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)};
async function pdf(o){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','jspdf');
  const d=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight(),M=40;let y=M+6;
  d.setFont('helvetica','bold');d.setFontSize(16);d.setTextColor(168,29,22);d.text(o.title,M,y);y+=20;
  d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(90,90,90);(o.sub||[]).forEach(l=>{d.text(l,M,y);y+=14});y+=10;
  const t=o.table,cw=t.w.map(x=>x*(W-2*M)),row=(c,hd,z,low)=>{
    if(y>H-M){d.addPage();y=M}
    if(hd){d.setFillColor(168,29,22);d.rect(M,y-12,W-2*M,19,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold')}
    else{if(z){d.setFillColor(246,243,242);d.rect(M,y-12,W-2*M,19,'F')}d.setTextColor(low?179:30,low?38:30,low?30:30);d.setFont('helvetica','normal')}
    d.setFontSize(9.5);let x=M+5;c.forEach((v,i)=>{d.text(String(v),x,y+1,{maxWidth:cw[i]-8});x+=cw[i]});y+=19};
  row(t.head,true);t.rows.forEach((r,i)=>row(r,false,i%2===0,t.low&&t.low(r)));
  const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(140,140,140);d.text('CampusAttend · CSJMU Kanpur · Page '+i+' of '+n,M,H-18)}
  d.save(o.name)}
const run=async(fn)=>{try{await fn()}catch(e){fail(e)}};
const pull=async ids=>{const out=[];await Promise.all(ids.map(async id=>(await F.getDocs(F.query(F.collection(db,'history'),F.where('classId','==',id)))).docs.forEach(d=>out.push(d.data()))));return out};
const nameOf=r=>(D.students.find(s=>s.roll===r)||{}).name||'';
const pc=(p,t)=>t?Math.round(p*1000/t)/10:0;
async function classData(cid,a,b){
  const c=D.classes.find(x=>x.id===cid),h=(await pull([cid])).filter(x=>(!a||x.date>=a)&&(!b||x.date<=b));
  const sm=new Map();h.forEach(x=>sm.set(x.sessionId,{id:x.sessionId,date:x.date,at:x.startedAt||0}));
  const sess=[...sm.values()].sort((x,y)=>x.at-y.at);
  const rolls=[...new Set(D.enrollments.filter(e=>e.classId===cid&&e.status==='approved').map(e=>e.roll).concat(h.map(x=>x.roll)))].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true}));
  const rows=rolls.map(r=>{const mine=h.filter(x=>x.roll===r),p=mine.filter(x=>x.status==='P').length;
    return{roll:r,name:nameOf(r),p,t:mine.length,pct:pc(p,mine.length),cells:sess.map(s=>{const m=mine.find(x=>x.sessionId===s.id);return m?m.status:'-'})}});
  return{c,sess,rows}}
async function cohortData(co){
  const cl=D.classes.filter(x=>x.cohort===co),h=await pull(cl.map(x=>x.id));
  const rolls=[...new Set(D.students.filter(s=>s.cohort===co&&s.status==='active').map(s=>s.roll).concat(h.filter(x=>cl.some(c=>c.id===x.classId)).map(x=>x.roll)))].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true}));
  const rows=rolls.map(r=>{let P=0,T=0;const cells=cl.map(c=>{const m=h.filter(x=>x.roll===r&&x.classId===c.id),p=m.filter(x=>x.status==='P').length;P+=p;T+=m.length;return p+'/'+m.length});return{roll:r,name:nameOf(r),cells,pct:pc(P,T),P,T}});
  return{cl,rows}}
const ttC=()=>S.f!=='all'?S.f:(D.cohorts[0]||{}).id;
const ttRows=co=>{const r=[];for(let d=1;d<=6;d++)D.classes.filter(c=>c.cohort===co&&(c.days||[]).includes(d)).sort((x,y)=>mins(x.slot)-mins(y.slot)).forEach(c=>r.push([FULL[d],c.slot,c.subject,c.teacherName]));return r};
const sig=()=>LIVE.filter(s=>s.expiresAt>Date.now()).map(s=>s.id+s.code).join();
function after(){const els=[...document.querySelectorAll('.qr[data-code]')];if(!els.length)return;
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','QRCode').then(()=>els.forEach(el=>{if(el.dataset.done===el.dataset.code)return;el.innerHTML='';new QRCode(el,{text:el.dataset.code,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});el.dataset.done=el.dataset.code})).catch(()=>{})}


const V={
overview(){
  const pt=D.teachers.filter(t=>t.status==='pending'),pe=D.enrollments.filter(e=>e.status==='pending');
  let h='';
  if(errCode)h+='<div class="warnbox">Could not read some data ('+esc(errCode)+'). Check your Firestore rules.</div>';
  if(!D.cohorts.length)h+='<div class="warnbox">Add your cohorts first (Cohorts tab). Students pick their cohort from this list while signing up.</div>';
  h+='<div class="stats">'+[['Teachers',D.teachers.filter(t=>t.status==='approved').length],['Pending teachers',pt.length],['Students',D.students.filter(s=>s.status==='active').length],['Classes',D.classes.length],['Pending requests',pe.length],['Cohorts',D.cohorts.length]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')+'</div>';
  h+='<div class="sect">Teachers waiting for approval</div>'+(pt.length?'<div class="grid">'+pt.slice(0,6).map(t=>card(t.name,t.empId+' · '+t.dept,'',setB('teachers',t.id,'approved','Approve','ok')+setB('teachers',t.id,'rejected','Reject','d'))).join('')+'</div>'+(pt.length>1?'<div style="margin-top:10px">'+B('data-do="approveAll"','Approve all '+pt.length,'p')+'</div>':''):empty('All clear','No teacher is waiting for approval.'));
  return{tools:h,list:()=>''};
},
teachers(){
  const pend=D.teachers.filter(t=>t.status==='pending').length;
  return{tools:'<div class="tools">'+search('Search name, employee ID or department')+(pend?B('data-do="approveAll"','Approve all pending ('+pend+')','p'):'')+'</div><div class="tools">'+fchips(['all','pending','approved','rejected','terminated'])+'</div>',
  list:()=>{const r=D.teachers.filter(t=>hit(t,['name','empId','dept'])&&(S.f==='all'||t.status===S.f)).sort((a,b)=>pf(a)-pf(b));
    return r.length?'<div class="grid">'+r.map(t=>card(t.name,t.empId+' · '+t.dept+' · '+t.designation,t.status,
      (t.status==='pending'?setB('teachers',t.id,'approved','Approve','ok')+setB('teachers',t.id,'rejected','Reject','d'):t.status==='approved'?setB('teachers',t.id,'terminated','Terminate','d'):setB('teachers',t.id,'approved','Restore','ok'))+delB('teachers',t.id))).join('')+'</div>':empty('No teachers found','Try a different search or filter.')}};
},
students(){
  return{tools:'<div class="tools">'+search('Search name or roll number')+'<select class="in" id="fs" aria-label="Cohort">'+cohortOpts(true)+'</select></div>',
  list:()=>{const r=D.students.filter(s=>hit(s,['name','roll'])&&(S.f==='all'||s.cohort===S.f)).sort((a,b)=>String(a.roll).localeCompare(String(b.roll),undefined,{numeric:true}));
    return r.length?'<div class="grid">'+r.map(s=>card(s.name,s.roll+' · '+cname(s.cohort),s.status,(s.status==='active'?setB('students',s.id,'terminated','Disable login','d'):setB('students',s.id,'active','Enable login','ok'))+delB('students',s.id))).join('')+'</div>':empty('No students found','Students appear here after they sign up.')}};
},
classes(){
  const ap=D.teachers.filter(t=>t.status==='approved');
  return{tools:'<div class="form"><h2>Add a class</h2><div class="two"><label><span>Subject</span><input class="in" id="c-s" placeholder="e.g. Data Structures"></label><label><span>Cohort</span><select class="in" id="c-c">'+cohortOpts()+'</select></label><label><span>Teacher</span><select class="in" id="c-t"><option value="">Select teacher</option>'+ap.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' ('+esc(t.empId)+')</option>').join('')+'</select></label><label><span>Time</span><input class="in" id="c-sl" type="time" value="10:00"></label></div><div><div style="font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 6px 2px">Days</div><div class="fchips" id="c-d">'+[1,2,3,4,5,6].map(i=>'<label class="dc"><input type="checkbox" id="cd'+i+'" value="'+i+'"><span>'+DAYS[i]+'</span></label>').join('')+'</div></div>'+B('data-do="addClass"','Add class','p')+'</div>',
  list:()=>D.classes.length?'<div class="grid">'+D.classes.map(c=>card(c.subject,cname(c.cohort)+' · '+c.teacherName+' · '+c.slot+' · '+(c.days||[]).map(x=>DAYS[x]).join(', '),'',delB('classes',c.id))).join('')+'</div>':empty('No classes yet','Add the first class above.')};
},
enrollments(){

},
cohorts(){

},

},
timetable(){

  list:()=>{const co=ttC();if(!co)return empty('No cohorts yet','Add a cohort and its classes first.');
    return[1,2,3,4,5,6].map(d=>{const r=D.classes.filter(c=>c.cohort===co&&(c.days||[]).includes(d)).sort((a,b)=>mins(a.slot)-mins(b.slot));
      return r.length?'<div class="sect">'+FULL[d]+'</div><div class="grid">'+r.map(c=>card(c.subject,c.slot+' · '+c.teacherName,'','')).join('')+'</div>':''}).join('')||empty('No classes','This cohort has no classes yet.')}};
},
codes(){
  lastSig=sig();const L=LIVE.filter(s=>s.expiresAt>Date.now());
  return{tools:liveErr?'<div class="warnbox">Could not read live sessions ('+esc(liveErr)+'). Allow admin to read the sessions collection in Firestore rules.</div>':'',
  list:()=>L.length?'<div class="grid">'+L.map(s=>{const c=D.classes.find(x=>x.id===s.classId)||{};
    return'<div class="card note" style="flex-direction:column;align-items:flex-start"><div><b>'+esc(c.subject||'Class')+'</b><small>'+esc(cname(c.cohort))+' · '+esc(c.teacherName||'')+'</small></div>'+(s.code?'<div class="qr" data-code="'+esc(s.code)+'" style="background:#fff;padding:10px;border-radius:14px;align-self:center"></div><div style="align-self:center;font-size:30px;font-weight:800;letter-spacing:.14em">'+esc(String(s.code).slice(0,3)+' '+String(s.code).slice(3))+'</div>':'<p>Code is being generated…</p>')+'</div>'}).join('')+'</div>':empty('No live session','When a teacher starts attendance, its code and QR appear here.')};
},
notices(){
  return{tools:'<div class="form"><h2>Post an announcement</h2><label><span>Send to</span><select class="in" id="n-c"><option value="ALL">Everyone</option>'+D.cohorts.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name||c.id)+'</option>').join('')+'</select></label><label><span>Title</span><input class="in" id="n-t" maxlength="80"></label><label><span>Message</span><textarea class="in" id="n-m" maxlength="500"></textarea></label>'+B('data-do="post"','Post announcement','p')+'</div>',
  list:()=>{const r=D.announcements.slice().sort((a,b)=>ms(b)-ms(a));return r.length?'<div class="grid">'+r.map(a=>'<div class="card note"><div class="grow"><b>'+esc(a.title)+'</b><small>'+esc(a.teacherName||'Admin')+' · '+(a.cohort==='ALL'?'Everyone':esc(cname(a.cohort)))+'</small></div>'+delB('announcements',a.id)+'<p>'+esc(a.body)+'</p></div>').join('')+'</div>':empty('No announcements','Posted messages are listed here.')}};
},
promote(){
  const opts=D.cohorts.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name||c.id)+' ('+nStu(c.id)+')</option>').join('');
  return{tools:'<div class="form"><h2>Semester-end promotion</h2><p style="color:var(--ink2);font-size:13.5px">Move every active student of one cohort to the next. Old attendance records stay safe. Students then request their new subjects.</p><div class="two"><label><span>From cohort</span><select class="in" id="p-f"><option value="">Select</option>'+opts+'</select></label><label><span>Move to</span><select class="in" id="p-t"><option value="">Select</option>'+D.cohorts.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name||c.id)+'</option>').join('')+'<option value="__out">Passed out (disable login)</option></select></label></div><div id="p-info" style="font-size:13.5px;color:var(--ink2)"></div>'+B('data-do="promote"','Promote students','p')+'</div>',list:()=>''};
}
};
const TABS=[['overview','Overview'],['teachers','Teachers'],['students','Students'],['classes','Classes'],['enrollments','Requests'],['cohorts','Cohorts'],['timetable','Timetable'],['reports','Reports'],['codes','Live codes'],['notices','Announcements'],['promote','Promotion']];
function render(full){
  const badge={teachers:D.teachers.filter(t=>t.status==='pending').length,enrollments:D.enrollments.filter(e=>e.status==='pending').length};
  $('tabs').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+(badge[t[0]]?'<i class="dot">'+badge[t[0]]+'</i>':'')+'</button>').join('');
  const a=document.activeElement,typing=a&&$('main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  cur=V[S.tab]();
  if(typing&&!full){const l=$('list');if(l)l.innerHTML=cur.list();after();return}
  const keep={};if(!full)$('main').querySelectorAll('input[id],textarea[id],select[id]').forEach(n=>{if(n.id!=='q')keep[n.id]=n.type==='checkbox'?n.checked:n.value});
  $('main').innerHTML=cur.tools+'<div id="list">'+cur.list()+'</div><p class="gd-foot">'+GUARD.text('admin')+'</p>';
  Object.keys(keep).forEach(k=>{const n=$(k);if(!n)return;if(n.type==='checkbox')n.checked=keep[k];else n.value=keep[k]});
  after();
}
function start(){
  if(started)return;started=true;GUARD.declare('admin');
  F.onSnapshot(F.query(F.collection(db,'sessions'),F.where('status','==','open')),s=>{LIVE=s.docs.map(d=>({id:d.id,...d.data()}));liveErr='';if(S.tab==='codes')render()},e=>{liveErr=e.code;if(S.tab==='codes')render()});
  setInterval(()=>{if(S.tab==='codes'&&sig()!==lastSig)render()},5000);
  Object.keys(D).forEach(c=>F.onSnapshot(F.collection(db,c),s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{errCode=e.code;render()}));
}
const upd=(col,id,data)=>F.updateDoc(F.doc(db,col,id),data).catch(fail);
const val=id=>$(id).value.trim();

const DISC='Disclaimer: this change is saved to the live database immediately and is visible to teachers and students. It is not undone automatically. Student data is confidential; use it only for official college work.';
const ask=o=>new Promise(res=>{
  const h=document.createElement('div');h.className='ov';
  h.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true" aria-label="'+esc(o.title)+'"><h3>'+esc(o.title)+'</h3><p class="wn'+(o.danger?' bad':'')+'">'+esc(o.warn)+'</p>'+(o.items&&o.items.length?'<ul>'+o.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>':'')+'<p class="dis">'+esc(o.disc||DISC)+'</p><label class="ck"><input type="checkbox" id="ak"><span>I declare that I am the authorised admin, I have checked the details above, and I want to continue.</span></label><div class="row"><button class="b" data-n>Cancel</button><button class="b '+(o.danger?'d':'p')+'" data-y disabled>'+esc(o.ok||'Confirm')+'</button></div></div>';
  const end=v=>{h.remove();res(v)},y=h.querySelector('[data-y]');
  h.addEventListener('change',e=>{if(e.target.id==='ak')y.disabled=!e.target.checked});
  h.addEventListener('click',e=>{if(e.target.closest('[data-y]'))end(true);else if(e.target.closest('[data-n]')||e.target===h)end(false)});
  document.body.appendChild(h);h.querySelector('#ak').focus()});
const MSG={
 'teachers:approved':['Approve teacher','This teacher will be able to sign in, take attendance and see students of their classes.',0],
 'teachers:rejected':['Reject teacher','This registration will be rejected and the teacher will not be able to sign in.',1],
 'teachers:terminated':['Terminate teacher','The teacher loses access immediately and cannot take attendance. Old attendance records stay in the database.',1],
 'students:terminated':['Disable student login','The student cannot sign in until you enable the login again.',1],
 'students:active':['Enable student login','The student will be able to sign in and mark attendance again.',0],
 'enrollments:approved':['Approve subject request','The student will be counted in this subject and its attendance will start.',0],
 'enrollments:rejected':['Reject subject request','The student will not be counted in this subject.',1]};
const nm=(col,id)=>{const r=D[col].find(x=>x.id===id)||{};return r.name||r.subject||r.title||id};
async function gateSet(col,id,st){const m=MSG[col+':'+st]||['Change status','This will change the status to '+st+'.',0];
  if(await ask({title:m[0],warn:m[1],danger:m[2],items:['Record: '+nm(col,id),'New status: '+st],ok:'Yes, '+m[0].toLowerCase()}))upd(col,id,{status:st})}
const DL={repCsv:'class report (CSV)',repPdf:'class report (PDF)',coCsv:'cohort summary (CSV)',coPdf:'cohort summary (PDF)',ttPdf:'timetable (PDF)'};
async function gateDel(col,id){
  if(col==='cohorts'&&(nStu(id)||D.classes.some(x=>x.cohort===id)))return toast('This cohort still has students or classes. Move them first.',1);
  const kind={teachers:'teacher',students:'student',classes:'class',enrollments:'subject request',cohorts:'cohort',announcements:'announcement'}[col]||'record';
  if(await ask({title:'Delete '+kind+' permanently',danger:1,warn:'This '+kind+' will be erased from the database and cannot be recovered. Only admins can do this.',items:['Record: '+nm(col,id)].concat(col==='teachers'||col==='students'?['The person loses access; their old attendance records stay.']:[]),ok:'Yes, delete permanently'}))F.deleteDoc(F.doc(db,col,id)).catch(fail)}
async function gate(k){
  if(DL[k]){const rep=k!=='ttPdf';if(!await ask({title:'Download '+DL[k],warn:rep?'This file contains student names, roll numbers and attendance. Keep it safe and do not share it outside the college.':'This file will be saved to your device.',items:['The file is created on your device from live data.'],disc:rep?'Disclaimer: attendance data is confidential. Sharing it with unauthorised people may break college rules and privacy laws.':'Disclaimer: the timetable shows data as it is now in the database.',ok:'Download'}))return}
  DO[k]()}
const DO={
  repCsv:()=>run(async()=>{const id=val('r-cl');if(!id)return toast('Select a class',1);const r=await classData(id,val('r-a'),val('r-b'));if(!r.rows.length)return toast('No attendance records found',1);
    dl('Attendance_'+r.c.subject.replace(/\W+/g,'_')+'.csv',csvOut([['Roll No','Name','Present','Total','Percentage'].concat(r.sess.map(x=>x.date))].concat(r.rows.map(x=>[x.roll,x.name,x.p,x.t,x.t?x.pct:''].concat(x.cells)))));toast('CSV downloaded')}),
  repPdf:()=>run(async()=>{const id=val('r-cl'),a=val('r-a'),b=val('r-b');if(!id)return toast('Select a class',1);const r=await classData(id,a,b);if(!r.rows.length)return toast('No attendance records found',1);
    await pdf({name:'Attendance_'+r.c.subject.replace(/\W+/g,'_')+'.pdf',title:r.c.subject+' · Attendance report',sub:[cname(r.c.cohort)+' · '+r.rows.length+' students · '+r.sess.length+' sessions'+(a||b?' · '+(a||'start')+' to '+(b||'today'):''),'Teacher: '+r.c.teacherName+' · Generated '+new Date().toLocaleDateString('en-GB')],
      table:{head:['Roll No','Name','Present','Total','%'],w:[.2,.4,.13,.13,.14],rows:r.rows.map(x=>[x.roll,x.name,x.p,x.t,x.t?x.pct+'%':'-']),low:x=>parseFloat(x[4])<75}});toast('PDF downloaded')}),
  coCsv:()=>run(async()=>{const co=val('r-co');if(!co)return toast('Select a cohort',1);const r=await cohortData(co);if(!r.rows.length)return toast('No students found',1);
    dl('Cohort_'+co+'.csv',csvOut([['Roll No','Name'].concat(r.cl.map(c=>c.subject),['Overall %'])].concat(r.rows.map(x=>[x.roll,x.name].concat(x.cells,[x.P+x.T?x.pct:''])))));toast('CSV downloaded')}),
  coPdf:()=>run(async()=>{const co=val('r-co');if(!co)return toast('Select a cohort',1);const r=await cohortData(co);if(!r.rows.length)return toast('No students found',1);
    const k=r.cl.length,w=[.14,.26].concat(Array(k).fill(.5/Math.max(k,1)),[.1]);
    await pdf({name:'Cohort_'+co+'.pdf',title:cname(co)+' · Attendance summary',sub:[r.rows.length+' students · '+k+' subjects · Generated '+new Date().toLocaleDateString('en-GB')],
      table:{head:['Roll','Name'].concat(r.cl.map(c=>c.subject.slice(0,10)),['Overall']),w,rows:r.rows.map(x=>[x.roll,x.name].concat(x.cells,[x.P+x.T?x.pct+'%':'-'])),low:x=>parseFloat(x[x.length-1])<75}});toast('PDF downloaded')}),
  ttPdf:()=>run(async()=>{const co=ttC(),r=ttRows(co);if(!r.length)return toast('No classes to export',1);
    await pdf({name:'Timetable_'+co+'.pdf',title:cname(co)+' · Weekly timetable',sub:['CampusAttend · CSJMU Kanpur'],table:{head:['Day','Time','Subject','Teacher'],w:[.18,.16,.38,.28],rows:r}});toast('PDF downloaded')}),
  async approveAll(){const p=D.teachers.filter(t=>t.status==='pending');if(!p.length)return;
    if(!await ask({title:'Approve all pending teachers',warn:'All '+p.length+' pending teacher'+(p.length===1?'':'s')+' will get full teacher access at once. Check each name first.',items:p.slice(0,8).map(t=>t.name+' ('+t.empId+')').concat(p.length>8?['and '+(p.length-8)+' more']:[]),ok:'Approve all '+p.length}))return;
    const b=F.writeBatch(db);p.forEach(t=>b.update(F.doc(db,'teachers',t.id),{status:'approved'}));b.commit().then(()=>toast(p.length+' approved')).catch(fail)},
  async addClass(){const t=D.teachers.find(x=>x.id===val('c-t')),days=[...document.querySelectorAll('#c-d input:checked')].map(i=>+i.value),s=val('c-s'),c=val('c-c');
    if(!s||!c||!t||!days.length||!val('c-sl'))return toast('Fill subject, cohort, teacher, time and days',1);
    if(!await ask({title:'Add class',warn:'This class becomes visible to students of the cohort and to the teacher. Check subject, cohort, teacher, time and days.',items:[s+' · '+cname(c),'Teacher: '+t.name,'Time: '+to12(val('c-sl'))+' · '+days.map(x=>DAYS[x]).join(', ')],ok:'Add class'}))return;
    F.addDoc(F.collection(db,'classes'),{subject:s,cohort:c,slot:to12(val('c-sl')),days,teacherUid:t.id,teacherEmp:t.empId,teacherName:t.name,createdAt:F.serverTimestamp()}).then(()=>{toast('Class added');$('c-s').value=''}).catch(fail)},
  async addCohort(){let k=val('co-k');if(k==='__new')k=val('co-n').toUpperCase().replace(/[^A-Z]/g,'');const n=val('co-s');if(!k||!n)return toast('Select course and semester',1);
    const id=k+n;if(D.cohorts.some(c=>c.id===id))return toast(id+' already exists',1);
    if(!await ask({title:'Add cohort',warn:'Students will see this cohort in the signup list. The code cannot be renamed later, so check it carefully.',items:['Code: '+id,'Name: '+k+' Semester '+n],ok:'Add cohort'}))return;
    F.setDoc(F.doc(db,'cohorts',id),{name:k+' Semester '+n,createdAt:F.serverTimestamp()}).then(()=>{toast(id+' added');$('co-s').value=''}).catch(fail)},
  async post(){const t=val('n-t'),m=val('n-m');if(!t||!m)return toast('Add a title and a message',1);
    if(!await ask({title:'Post announcement',warn:'Everyone in the selected audience will see this message right away. It cannot be edited after posting; you can delete it later.',items:['Send to: '+(val('n-c')==='ALL'?'Everyone':cname(val('n-c'))),'Title: '+t],ok:'Post now'}))return;
    F.addDoc(F.collection(db,'announcements'),{cohort:val('n-c'),title:t,body:m,teacherUid:'admin',teacherName:'Admin',createdAt:F.serverTimestamp()}).then(()=>{toast('Announcement posted');$('n-t').value='';$('n-m').value=''}).catch(fail)},
  async promote(){const from=val('p-f'),to=val('p-t');if(!from||!to)return toast('Choose both cohorts',1);if(from===to)return toast('Pick two different cohorts',1);
    const list=D.students.filter(s=>s.cohort===from&&s.status==='active');if(!list.length)return toast('No active students in that cohort',1);
    if(!await ask({title:to==='__out'?'Mark cohort as passed out':'Semester-end promotion',danger:1,warn:to==='__out'?'Login of every active student in this cohort will be disabled.':'Every active student of this cohort moves to the next cohort and must request subjects again.',items:[list.length+' student'+(list.length===1?'':'s'),'From: '+cname(from),'To: '+(to==='__out'?'Passed out (login disabled)':cname(to)),'Old attendance records stay safe.'],ok:'Yes, promote '+list.length}))return;
    try{for(let i=0;i<list.length;i+=400){const b=F.writeBatch(db);list.slice(i,i+400).forEach(s=>b.update(F.doc(db,'students',s.id),to==='__out'?{status:'terminated'}:{cohort:to}));await b.commit()}toast(list.length+' students updated')}catch(e){fail(e)}}
};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.closest('#login'))return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;S.q='';S.f='all';render(true)}
  else if(d.f){S.f=d.f;render(true)}
  else if(d.set)gateSet(d.set,d.id,d.st);
  else if(d.del)gateDel(d.del,d.id);
  else if(d.do)gate(d.do);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('list').innerHTML=cur.list()}});
document.addEventListener('change',e=>{
  if(e.target.id==='co-k')$('co-nw').hidden=e.target.value!=='__new';
  if(e.target.id==='fs'){S.f=e.target.value;$('list').innerHTML=cur.list()}
  if(e.target.id==='p-f'){const n=nStu(e.target.value);$('p-info').textContent=e.target.value?n+' active student'+(n===1?'':'s')+' will move.':''}
});
$('login').onsubmit=e=>{e.preventDefault();$('err').textContent='';
  if(!FBT.configured())return $('err').textContent='Add Firebase config in fb-teacher.js';
  FBT.adminLogin($('em').value,$('pw').value).catch(()=>$('err').textContent='Sign in failed. Check email and password.')};
$('out').onclick=()=>FBT.logout();
FBT.admin(ok=>{$('login').hidden=ok;$('app').hidden=!ok;if(ok)start();else if(started)location.reload()});
