<style>
:root{
  --brand:#D3261D;--brand-soft:#FCECEA;--btn:#C8221A;--btn-ink:#fff;
  --bg:#F6F3F2;--surface:#FFFFFF;--surface-2:#FAF6F5;--ink:#1D1816;--ink-2:#645B58;--ink-3:#857B78;--line:#EAE3E1;
  --ok:#14804F;--ok-soft:#E2F4EB;--warn:#9A5800;--warn-soft:#FFF1D6;--bad:#B3261E;--bad-soft:#FCE9E7;
  --radius:18px;--shadow:0 1px 2px rgba(70,20,15,.06),0 8px 24px rgba(70,20,15,.08);
  --nav-h:68px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --brand:#F0584E;--brand-soft:#3A1B19;--btn:#CF3128;--btn-ink:#fff;
  --bg:#120E0E;--surface:#1D1717;--surface-2:#251D1D;--ink:#F6EFED;--ink-2:#BDB0AC;--ink-3:#9A8D89;--line:#332828;
  --ok:#3DD598;--ok-soft:#14302A;--warn:#F5B547;--warn-soft:#352A12;--bad:#FF8379;--bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
h1,h2,h3{line-height:1.2}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media(min-width:520px){
  body{background:linear-gradient(160deg,#3b0f0c,#150606)}
  .app{box-shadow:0 0 70px rgba(0,0,0,.5)}
}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#BC2018 0%,#85120D 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;gap:12px;min-height:68px}
.topbar .logo{width:42px;height:42px;border-radius:50%;background:#fff;flex:none;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.topbar .tb-text{flex:1;min-width:0}
.topbar h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar p{font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:inherit;flex:none}
.topbar .icon-btn{background:rgba(255,255,255,.15)}
.topbar .icon-btn:active{background:rgba(255,255,255,.28)}

/* ---------- screens + nav ---------- */
.screen{display:none;padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);animation:fade .22s ease}
.screen.active{display:block}
.screen.has-cta{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 112px)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);position:relative}
.nav button.active{color:var(--brand)}
.nav button.active::before{content:"";position:absolute;top:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));width:100%;max-width:480px;padding:26px 16px 12px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);z-index:25}

/* ---------- type + layout helpers ---------- */
.hello h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.hello p{color:var(--ink-2);font-size:13.5px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.section-title h2{font-size:15px;font-weight:700}
.link{color:var(--brand);font-weight:600;font-size:13px;padding:4px 2px}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{font-size:15px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:left}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--ink-2);line-height:1.25;display:block;margin-top:2px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--brand-soft);color:var(--brand);flex:none}
.avatar.lg{width:72px;height:72px;font-size:24px}
.bubble{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;text-align:left}
button.item:active{background:var(--surface-2)}
.item .t{font-weight:600;font-size:14.5px}
.item .s{font-size:12.5px;color:var(--ink-2)}
.item.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.item.sel .radio{border-color:var(--brand);background:var(--brand);color:#fff}
.item.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

/* ---------- chips / progress ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s ease}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.bar.brand i{background:var(--brand)}
.bar.mark{position:relative}
.bar.mark::after{content:"";position:absolute;left:75%;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.7}

/* ---------- ring ---------- */
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;letter-spacing:-.02em;line-height:1}
.ring-wrap .lbl small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:3px}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-opacity:1}
.ring-bg{stroke:var(--line)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringin .9s ease-out}
.ring-fg.ok{stroke:var(--ok)}.ring-fg.warn{stroke:var(--warn)}.ring-fg.bad{stroke:var(--bad)}.ring-fg.brand{stroke:var(--brand)}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15px;background:var(--btn);color:var(--btn-ink);width:100%;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.93)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:11px;width:auto}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:block}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 6px 2px}
.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.input-wrap{position:relative}
.input-wrap .input{padding-left:44px}
.input-wrap>svg.lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.input-wrap .trail{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;color:var(--ink-3)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}

/* P / A toggle */
.pa{display:inline-grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.pa button{width:44px;height:38px;font-weight:800;font-size:13px;color:var(--ink-3);background:var(--surface)}
.pa button.p.on{background:var(--ok);color:#fff}
.pa button.a.on{background:var(--bad);color:#fff}
[data-theme="dark"] .pa button.p.on,[data-theme="dark"] .pa button.a.on{color:#0c0c0c}

/* ---------- live code ---------- */
.codecard{background:linear-gradient(145deg,#BC2018,#7C0F0A);color:#fff;border-radius:22px;padding:20px 16px 18px;text-align:center;box-shadow:0 14px 34px rgba(150,20,14,.34)}
.codecard .cls{font-size:13px;opacity:.9}
.codecard .code{font-size:46px;font-weight:800;letter-spacing:.14em;margin:8px 0 4px 0.14em;font-variant-numeric:tabular-nums}
.codecard .hint{font-size:12.5px;opacity:.88}
.codecard .cbar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin:14px auto 0;max-width:260px;overflow:hidden}
.codecard .cbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .25s linear}
.pulse{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;margin-bottom:6px}
.pulse::before{content:"";width:8px;height:8px;border-radius:50%;background:#7CFFB2;animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(124,255,178,.7)}100%{box-shadow:0 0 0 9px rgba(124,255,178,0)}}

.otp{width:100%;text-align:center;font-size:32px;font-weight:800;letter-spacing:.38em;padding-left:.38em;min-height:68px;border-radius:18px;border:2px solid var(--line);background:var(--surface);outline:none;font-variant-numeric:tabular-nums}
.otp:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.otp::placeholder{color:var(--line);letter-spacing:.3em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.result{text-align:center;padding:26px 16px}
.result .big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.result .big.ok{background:var(--ok-soft);color:var(--ok)}
.result .big.bad{background:var(--bad-soft);color:var(--bad)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.empty{text-align:center;padding:30px 20px;color:var(--ink-2)}
.empty .bubble{margin:0 auto 10px;width:54px;height:54px;border-radius:18px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

/* ---------- sheet + toast ---------- */
/* ---------- full pages + dialogs (replace bottom sheets) ---------- */
@keyframes ofade{from{opacity:0}}
@keyframes pin{from{transform:translateX(100%)}}
.pagehost{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;overflow:hidden}
.page{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;outline:0;animation:pin .28s cubic-bezier(.2,.85,.25,1)}
@media(min-width:520px){.pagehost{background:linear-gradient(160deg,#3b0f0c,#150606)}.page{box-shadow:0 0 70px rgba(0,0,0,.5)}}
.pagebar{flex:none;background:linear-gradient(135deg,#BC2018,#85120D);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;display:flex;align-items:center;gap:10px;min-height:64px}
.pagebar .icon-btn{background:rgba(255,255,255,.15)}.pagebar .icon-btn:active{background:rgba(255,255,255,.28)}
.pagebar .tb-text{flex:1;min-width:0}.pagebar h1{font-size:17px;font-weight:700}.pagebar p{font-size:12px;opacity:.88}
.pagebody{flex:1;overflow:auto;padding:16px 16px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pagefoot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
html.nopage,html.nopage body{overflow:hidden}
.dlg-host{position:fixed;inset:0;z-index:70;background:rgba(15,5,4,.55);display:grid;place-items:center;padding:20px;animation:ofade .2s}
.dlg{width:100%;max-width:360px;background:var(--surface);border-radius:22px;padding:22px 20px 18px;box-shadow:var(--shadow);outline:0;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}
.dlg h3{font-size:17px;margin-bottom:6px}.dlg .foot{display:flex;gap:10px;margin-top:18px}
.hero{background:linear-gradient(145deg,#BC2018,#7C0F0A);color:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 34px rgba(150,20,14,.28)}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.hero .small{opacity:.88}
.hero .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .kv div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px}.hero .kv b{display:block;font-size:18px}.hero .kv span{font-size:11.5px;opacity:.9;line-height:1.2;display:block}
.hero .hbar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}.hero .hbar i{display:block;height:100%;background:#fff;border-radius:99px}
.qa{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:12px}
.qa button{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.qa button svg{color:var(--brand)}.qa button:active{background:var(--surface-2)}
.badge{position:absolute;top:6px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font:700 11px/18px Inter,sans-serif;text-align:center;padding:0 5px;font-style:normal}
.sect{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}.cal small{color:var(--ink-3);font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600}
.cal button.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.cal button.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.cal button.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cal button.sel{border:2px solid var(--brand)}
.daychip{position:relative}.daychip input{position:absolute;opacity:0;inset:0}.daychip span{display:block;padding:9px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.daychip input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}.daychip input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent)}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.mbar b{font-size:16px}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 76px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
.toast{background:#241816;color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;max-width:420px;animation:tin .25s ease}
.toast.ok svg{color:#5BE3A0}.toast.bad svg{color:#FF8E85}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

.hist{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.tag-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cls-card .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cls-card .actions .btn{min-height:42px;font-size:14px}
.mini-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sticky-search{margin-top:12px}
.summary-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.flexwrap{display:flex;flex-wrap:wrap;gap:6px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 2px 10px;font-weight:600;font-size:13.5px}
</style>

<script>
/* CampusAttend · CSJMU Kanpur — shared data layer + UI helpers
   Data lives in the browser's localStorage so index / teacher / student pages share it.
   Replace the functions inside `CA` with Firebase/REST calls to go multi-device. */
const CA=(function(){
'use strict';

/* ---------- tiny utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDate=s=>{const d=parseYmd(s);return DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]};
const fmtDateLong=d=>DAYS[d.getDay()]+', '+d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear();
const fmtTime=ms=>{const d=new Date(ms);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap};
const mmss=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(ms/60))+':'+pad(ms%60)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>n.replace(/^(Dr|Prof)\.?\s+/i,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let idn=0;const newId=()=>'S'+Date.now().toString(36)+(idn++).toString(36)+Math.floor(Math.random()*1296).toString(36);
function slotMs(dateStr,slot){const d=parseYmd(dateStr);const m=/(\d+):(\d+)\s*(AM|PM)/i.exec(slot)||[0,10,0,'AM'];let h=+m[1]%12;if(/PM/i.test(m[3]))h+=12;d.setHours(h,+m[2],0,0);return d.getTime()}

/* ---------- demo data ---------- */
function seedDB(){return{v:1,teachers:[],students:[],cohorts:[],classes:[],sessions:[]}}

/* ---------- storage ---------- */
const REV='campusattend.rev';
let cache=null,cacheRev=null;const listeners=[];
const readRev=()=>{try{return localStorage.getItem(REV)}catch(e){return null}};
function db(){
  const r=readRev();
  if(cache&&r===cacheRev)return cache;   // re-read only when another tab saved
  cache=null;
  try{const raw=localStorage.getItem(KEY);if(raw)cache=JSON.parse(raw)}catch(e){}
  if(!cache||!cache.v){cache=seedDB();save();return cache}
  cacheRev=r;return cache;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(cache));localStorage.setItem(REV,Date.now()+'.'+Math.random())}catch(e){}
  cacheRev=readRev();
}
window.addEventListener('storage',e=>{if(e.key===KEY){listeners.forEach(f=>{try{f()}catch(x){}})}});
const onChange=f=>listeners.push(f);
function resetDemo(){try{localStorage.removeItem(KEY);localStorage.removeItem(FAIL)}catch(e){}cache=null;db()}

/* ---------- auth ---------- */
function login(role,id,pass){
  id=String(id).trim().toLowerCase();
  const list=role==='teacher'?db().teachers:db().students;
  const u=list.find(x=>x.id.toLowerCase()===id&&x.pass===pass);
  if(!u)return null;
  try{localStorage.setItem(SES,JSON.stringify({role,id:u.id,t:Date.now()}))}catch(e){}
  return u;
}
function current(role){
  try{
    const s=JSON.parse(localStorage.getItem(SES)||'null');
    if(!s||(role&&s.role!==role))return null;
    const list=s.role==='teacher'?db().teachers:db().students;
    const u=list.find(x=>x.id===s.id);
    return u?{role:s.role,user:u}:null;
  }catch(e){return null}
}
const logout=()=>{try{localStorage.removeItem(SES)}catch(e){}};

/* ---------- queries ---------- */
const getClass=id=>db().classes.find(c=>c.id===id);
const cohortName=id=>(db().cohorts.find(c=>c.id===id)||{}).name||id;
const teacherOf=id=>db().teachers.find(t=>t.id===id);
const roster=classId=>{const c=getClass(classId);return db().students.filter(s=>s.cohort===c.cohort&&(!c.fb||(c.enr||[]).includes(s.id)))};
const classesOfTeacher=tid=>db().classes.filter(c=>c.teacherId===tid);
const classesOfStudent=s=>db().classes.filter(c=>c.cohort===s.cohort);
const getSession=id=>db().sessions.find(s=>s.id===id);
const openSessionFor=classId=>db().sessions.find(s=>s.classId===classId&&s.status==='open');
const sessionsOf=(classId,closedOnly=true)=>db().sessions.filter(s=>s.classId===classId&&(!closedOnly||s.status==='closed')).sort((a,b)=>b.startedAt-a.startedAt);
function tally(studentId,classId){let p=0,t=0;sessionsOf(classId).forEach(s=>{const r=s.records[studentId];if(r){t++;if(r==='P')p++}});return{p,t,pct:t?p/t*100:0}}
function overall(studentId,classes){let p=0,t=0;classes.forEach(c=>{const x=tally(studentId,c.id);p+=x.p;t+=x.t});return{p,t,pct:t?p/t*100:0}}
function classStats(classId){
  const r=roster(classId);let p=0,t=0,low=0;
  r.forEach(s=>{const x=tally(s.id,classId);p+=x.p;t+=x.t;if(x.t&&x.pct<MIN_PCT)low++});
  return{p,t,pct:t?p/t*100:0,low,students:r.length,sessions:sessionsOf(classId).length};
}
const level=pct=>pct>=MIN_PCT?'ok':pct>=65?'warn':'bad';
const levelLabel={ok:'Safe',warn:'At risk',bad:'Shortage'};
function advice(p,t){
  if(!t)return'No classes held yet';
  const pct=p/t*100;
  if(pct>=MIN_PCT){const m=Math.floor(4*p/3-t+1e-9);return m>0?'You can miss '+m+' more class'+(m===1?'':'es')+' and stay at '+MIN_PCT+'%':'On the edge — don’t miss the next class'}
  const x=Math.ceil(3*t-4*p-1e-9);
  return'Attend the next '+x+' class'+(x===1?'':'es')+' in a row to reach '+MIN_PCT+'%';
}

/* ---------- live code ---------- */
function codeAt(sess,win){return String(Math.floor(rng((sess.seed^Math.imul(win,0x9E3779B1))>>>0)()*1000000)).padStart(6,'0')}
function liveCode(sess,now){now=now||Date.now();const w=Math.floor(now/WIN);return{code:codeAt(sess,w),left:WIN-(now%WIN),total:WIN}}

/* ---------- sessions ---------- */
function finalize(s,at){roster(s.classId).forEach(st=>{if(!s.records[st.id])s.records[st.id]='A'});s.status='closed';s.endedAt=at||Date.now()}
function sweep(){const now=Date.now();let ch=false;db().sessions.forEach(s=>{if(s.status==='open'&&now>=s.expiresAt){finalize(s,s.expiresAt);ch=true}});if(ch)save();return ch}
function startLive(classId){
  sweep();
  let s=openSessionFor(classId);if(s)return s;
  const now=Date.now();
  s={id:newId(),classId,date:ymd(new Date(now)),startedAt:now,expiresAt:now+SESSION_MS,method:'live',status:'open',seed:Math.floor(Math.random()*2147483647),records:{},marks:{}};
  db().sessions.push(s);save();return s;
}
function extend(id,ms){const s=getSession(id);if(s&&s.status==='open'){s.expiresAt+=ms;save()}return s}
function closeSession(id){const s=getSession(id);if(s&&s.status==='open'){finalize(s);save()}return s}
function setRecord(id,studentId,val){
  const s=getSession(id);if(!s)return;
  if(val===null)delete s.records[studentId];else s.records[studentId]=val;
  if(s.status==='open'){if(val==='P')s.marks[studentId]=Date.now();else delete s.marks[studentId]}
  save();
}
function saveManual(classId,dateStr,records){
  const c=getClass(classId);const isToday=dateStr===ymd(new Date());
  const st=isToday?Date.now():slotMs(dateStr,c.slot);
  const s={id:newId(),classId,date:dateStr,startedAt:st,endedAt:st,method:'manual',status:'closed',records:Object.assign({},records),marks:{}};
  db().sessions.push(s);save();return s;
}
function failsOf(){try{return JSON.parse(localStorage.getItem(FAIL)||'{}')}catch(e){return{}}}
function lockedLeft(id){const a=(failsOf()[id]||[]).filter(t=>Date.now()-t<60000);if(a.length>=5){return Math.max(0,a[a.length-1]+30000-Date.now())}return 0}
function registerFail(id){const f=failsOf();const a=(f[id]||[]).filter(t=>Date.now()-t<60000);a.push(Date.now());f[id]=a;try{localStorage.setItem(FAIL,JSON.stringify(f))}catch(e){}return a.length>=5}
function clearFails(id){const f=failsOf();delete f[id];try{localStorage.setItem(FAIL,JSON.stringify(f))}catch(e){}}
function submitCode(studentId,raw){
  sweep();
  const st=db().students.find(s=>s.id===studentId);
  const wait=lockedLeft(studentId);
  if(wait>0)return{ok:false,reason:'locked',wait};
  const code=String(raw).replace(/\D/g,'');
  if(code.length!==6)return{ok:false,reason:'format'};
  const now=Date.now(),w=Math.floor(now/WIN),mine=classesOfStudent(st).map(c=>c.id);
  const open=db().sessions.filter(s=>s.status==='open'&&now<s.expiresAt&&mine.includes(s.classId));
  for(const s of open){
    if(code===codeAt(s,w)||code===codeAt(s,w-1)){
      if(s.records[studentId]==='P')return{ok:false,reason:'already',cls:getClass(s.classId)};
      s.records[studentId]='P';s.marks[studentId]=now;save();clearFails(studentId);
      return{ok:true,cls:getClass(s.classId),at:now};
    }
  }
  registerFail(studentId);
  return{ok:false,reason:open.length?'invalid':'noSession'};
}
function openForStudent(st){
  sweep();const mine=classesOfStudent(st).map(c=>c.id);
  return db().sessions.filter(s=>s.status==='open'&&mine.includes(s.classId)).map(s=>({session:s,cls:getClass(s.classId),marked:s.records[st.id]==='P'}));
}

/* ---------- csv ---------- */
function csv(classId){
  const ss=sessionsOf(classId).slice().reverse();
  const rows=[['Roll No','Name','Present','Total','Percentage'].concat(ss.map(s=>s.date))];
  roster(classId).forEach(st=>{const t=tally(st.id,classId);rows.push([st.id,st.name,t.p,t.t,t.t?t.pct.toFixed(1):''].concat(ss.map(s=>s.records[st.id]||'-')))});
  return rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
}
function download(name,text){
  const b=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}

function ring(pct,size,stroke,cls,label){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(100,Math.max(0,pct))/100),m=size/2;
  return'<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc(label||Math.round(pct)+' percent')+'"><circle class="ring-bg" cx="'+m+'" cy="'+m+'" r="'+r+'" stroke-width="'+stroke+'"/><circle class="ring-fg '+cls+'" cx="'+m+'" cy="'+m+'" r="'+r+'" stroke-width="'+stroke+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="--c:'+c+'" transform="rotate(-90 '+m+' '+m+')"/></svg>';
}
const chip=(cls,text,ic)=>'<span class="chip '+cls+'">'+(ic?icon(ic,13):'')+esc(text)+'</span>';

function toast(msg,type){
  let w=document.getElementById('toasts');
  if(!w){w=document.createElement('div');w.id='toasts';w.className='toasts';w.setAttribute('aria-live','polite');document.body.appendChild(w)}
  const t=document.createElement('div');t.className='toast '+(type||'ok');
  t.innerHTML=icon(type==='bad'?'xc':'checkc',18)+'<span>'+esc(msg)+'</span>';
  w.appendChild(t);setTimeout(()=>t.remove(),2800);
}
let pageEl=null,pageCb=null,lastFocus=null,pushed=false,backing=false,dlgEl=null;
function page(o){
  if(!pageEl){lastFocus=document.activeElement;pageEl=document.createElement('div');pageEl.className='pagehost';document.body.appendChild(pageEl);document.documentElement.classList.add('nopage');

  pageEl.querySelector('.page').focus();return pageEl;
}
function closePage(fromPop){
  if(!pageEl)return;
  pageEl.remove();pageEl=null;document.documentElement.classList.remove('nopage');
  const cb=pageCb;pageCb=null;
  if(pushed&&fromPop!==true){pushed=false;backing=true;history.back()}else pushed=false;
  try{lastFocus&&lastFocus.focus&&lastFocus.focus()}catch(e){}
  cb&&cb();
}

  /* ---------------- choose class + method ---------------- */

  function rosterHTML(s){
    return CA.roster(s.classId).map(function(st){
      var r=s.records[st.id]==='P';
      return '<div class="item"><span class="avatar" style="'+(r?'background:var(--ok-soft);color:var(--ok)':'')+'">'+(r?ic('check',20):esc(CA.initials(st.name)))+'</span><span class="grow"><div class="t ellipsis">'+esc(st.name)+'</div><div class="s">'+esc(st.id)+' · '+(r?'Present at '+CA.fmtTime(s.marks[st.id]||s.startedAt):'Waiting')+'</div></span><button class="btn sm '+(r?'ghost':'soft')+'" data-act="lm" data-id="'+st.id+'" data-v="'+(r?'':'P')+'" aria-label="'+(r?'Undo present for ':'Mark present: ')+esc(st.name)+'">'+(r?'Undo':'Mark')+'</button></div>';
    }).join('');
  }
  function fillLive(force){
    var s=CA.getSession(S.sid);if(!s||!$('code'))return;
    var total=CA.roster(s.classId).length,lc=CA.liveCode(s);
    $('code').textContent=lc.code.slice(0,3)+' '+lc.code.slice(3);
    $('cb').style.width=(lc.left/lc.total*100)+'%';
    var m=0;for(var k in s.records)if(s.records[k]==='P')m++;
    $('mk').textContent=m;$('mkbar').style.width=(total?m/total*100:0)+'%';
    $('left').textContent=CA.mmss(s.expiresAt-Date.now());
    var sig=JSON.stringify(s.records);
    if(force||sig!==S.sig){S.sig=sig;$('roster').innerHTML=rosterHTML(s)}
  }
  function summary(s,title){
    var c=CA.getClass(s.classId),ros=CA.roster(s.classId);
    var pres=ros.filter(function(x){return s.records[x.id]==='P'}),abs=ros.filter(function(x){return s.records[x.id]!=='P'});
    var pct=ros.length?Math.round(pres.length/ros.length*100):0;
    CA.page({title:title||'Session saved',sub:c.subject,body:'<div class="result"><div class="big ok">'+ic('check',44)+'</div><h3>'+esc(c.subject)+'</h3><p class="muted" style="margin-top:4px"><b>'+pres.length+'</b> present · <b>'+abs.length+'</b> absent · '+pct+'%</p></div>'+(abs.length?'<div class="small muted" style="margin:0 2px 8px">Absent</div><div class="flexwrap">'+abs.map(function(a){return CA.chip('bad',a.name)}).join('')+'</div>':''),foot:'<button class="btn" data-close>Done</button>'});
  }

  /* ---------------- manual attendance ---------------- */
  function startManual(classId){
    var rec={};CA.roster(classId).forEach(function(s){rec[s.id]='P'});
    S.m={classId:classId,date:today(),rec:rec,q:''};go('manual');
  }
  function vManual(){
    var m=S.m;
    var h='<div class="card"><label class="field"><span>Class date</span><input class="input" type="date" id="mdate" max="'+today()+'" value="'+m.date+'"></label><div class="row" style="margin-top:12px;justify-content:space-between;flex-wrap:wrap"><div id="mcount" class="summary-row" style="margin:0"></div><div class="row" style="gap:8px"><button class="btn sm ghost" data-act="mall" data-v="P">All present</button><button class="btn sm ghost" data-act="mall" data-v="A">All absent</button></div></div></div>';
    h+='<div class="input-wrap sticky-search">'+lead('search')+'<input class="input" id="mq" type="search" placeholder="Search name or roll number" value="'+esc(m.q)+'" aria-label="Search students" autocomplete="off"></div>';
    h+='<div class="stack" id="mroster" style="margin-top:12px"></div>';
    return{html:h,cta:'<button class="btn" data-act="msave">'+ic('checkc',20)+' Save attendance</button>',after:fillManual};
  }
  function fillManual(){
    var m=S.m,ros=CA.roster(m.classId),q=m.q.trim().toLowerCase(),p=0,a=0;
    ros.forEach(function(s){if(m.rec[s.id]==='P')p++;else a++});
    $('mcount').innerHTML=CA.chip('ok',p+' present','check')+CA.chip('bad',a+' absent','x');
    var list=ros.filter(function(s){return!q||s.name.toLowerCase().indexOf(q)>-1||s.id.toLowerCase().indexOf(q)>-1});
    $('mroster').innerHTML=list.map(function(s){
      var v=m.rec[s.id];
      return '<div class="item"><span class="avatar">'+esc(CA.initials(s.name))+'</span><span class="grow"><div class="t ellipsis">'+esc(s.name)+'</div><div class="s">'+esc(s.id)+'</div></span><div class="pa" role="group" aria-label="Attendance for '+esc(s.name)+'"><button class="p'+(v==='P'?' on':'')+'" data-act="mpa" data-id="'+s.id+'" data-v="P" aria-pressed="'+(v==='P')+'" aria-label="Present">P</button><button class="a'+(v==='A'?' on':'')+'" data-act="mpa" data-id="'+s.id+'" data-v="A" aria-pressed="'+(v==='A')+'" aria-label="Absent">A</button></div></div>';
    }).join('')||emptyBox('search','No match','Try a different name or roll number.');
  }

  /* ---------------- reports ---------------- */
  function vReports(){
    var cls=myClasses(),R=S.rep;
    if(!R.classId||!cls.some(function(c){return c.id===R.classId}))R.classId=cls[0].id;
    var c=CA.getClass(R.classId),st=CA.classStats(c.id),ros=CA.roster(c.id);
    var h='<div class="hello"><h1>Reports</h1><p>Attendance by class, student and session.</p></div>';
    h+='<label class="field" style="margin-top:14px"><span>Class</span><select class="input" id="repClass" aria-label="Class">'+cls.map(function(x){return '<option value="'+x.id+'"'+(x.id===R.classId?' selected':'')+'>'+esc(x.subject)+' — '+esc(CA.cohortName(x.cohort))+'</option>'}).join('')+'</select></label>';
    h+='<div class="stats"><div class="stat"><b>'+st.sessions+'</b><span>Sessions held</span></div><div class="stat"><b>'+(st.sessions?Math.round(st.pct)+'%':'—')+'</b><span>Class average</span></div><div class="stat"><b>'+st.low+'</b><span>Below '+CA.MIN_PCT+'%</span></div></div>';
    h+='<button class="btn ghost" data-act="export" style="margin-top:12px">'+ic('download',18)+' Export CSV</button>';
    h+='<div class="seg" style="margin-top:16px" role="tablist"><button class="'+(R.tab==='students'?'on':'')+'" role="tab" aria-selected="'+(R.tab==='students')+'" data-act="rtab" data-v="students">'+ic('users',18)+' Students</button><button class="'+(R.tab==='sessions'?'on':'')+'" role="tab" aria-selected="'+(R.tab==='sessions')+'" data-act="rtab" data-v="sessions">'+ic('cal',18)+' Sessions</button></div>';
    if(R.tab==='students'){
      var rows=ros.map(function(s){return{s:s,x:CA.tally(s.id,c.id)}});
      rows.sort(function(a,b){return(a.x.t?a.x.pct:101)-(b.x.t?b.x.pct:101)});
      if(R.low)rows=rows.filter(function(r){return r.x.t&&r.x.pct<CA.MIN_PCT});
      h+='<div class="toggle-row"><span id="lowlbl">Show only students below '+CA.MIN_PCT+'%</span><button class="switch" role="switch" aria-checked="'+R.low+'" aria-labelledby="lowlbl" data-act="rlow"></button></div><div class="stack">';
      h+=rows.map(function(r){
        var lv=CA.level(r.x.pct);
        return '<button class="item" data-act="stu" data-id="'+r.s.id+'"><span class="avatar">'+esc(CA.initials(r.s.name))+'</span><span class="grow"><div class="t ellipsis">'+esc(r.s.name)+'</div><div class="s">'+esc(r.s.id)+' · '+r.x.p+' of '+r.x.t+' classes</div><div class="bar mark '+(lv==='ok'?'':lv)+'" style="margin-top:7px"><i style="width:'+Math.round(r.x.pct)+'%"></i></div></span>'+(r.x.t?CA.chip(lv,Math.round(r.x.pct)+'%'):CA.chip('neutral','—'))+'</button>';
      }).join('')||emptyBox('checkc','Everyone is on track','No students are below '+CA.MIN_PCT+'% in this class.');
      h+='</div>';
    }else{
      var ss=CA.sessionsOf(c.id);
      h+='<div class="stack" style="margin-top:12px">'+(ss.map(function(s){return sessionRow(s,false)}).join('')||emptyBox('cal','No sessions yet','Sessions you record will appear here.'))+'</div>';
    }
    return{html:h};
  }
  function renderSheet(){
    var b=CA.pageBody();if(!b||!S.sheet||b.dataset.kind!=='rec')return;
    var top=b.scrollTop,h='';
    if(S.sheet.type==='stu'){
      var c=CA.getClass(S.rep.classId),st=CA.db().students.find(function(x){return x.id===S.sheet.id}),x=CA.tally(st.id,c.id),lv=CA.level(x.pct);
      h+='<div class="card flat"><div class="row"><div class="grow"><div class="t" style="font-weight:700">'+esc(c.subject)+'</div><div class="small muted">'+x.p+' of '+x.t+' classes attended</div></div>'+(x.t?CA.chip(lv,Math.round(x.pct)+'% · '+CA.levelLabel[lv]):'')+'</div><p class="small muted" style="margin-top:8px">'+esc(CA.advice(x.p,x.t))+'</p></div><div class="small muted" style="margin:14px 2px 2px">Tap P or A to correct a record</div>';
      h+=CA.sessionsOf(c.id).map(function(s){return histRow(s,st.id,CA.fmtDate(s.date),CA.fmtTime(s.startedAt)+' · '+(s.method==='live'?'Live code':'Manual'))}).join('');
    }else{
      var s2=CA.getSession(S.sheet.id),c2=CA.getClass(s2.classId),ros=CA.roster(s2.classId),pr=ros.filter(function(q){return s2.records[q.id]==='P'}).length;
      h+='<div class="summary-row">'+CA.chip('ok',pr+' present','check')+CA.chip('bad',(ros.length-pr)+' absent','x')+CA.chip('neutral',s2.method==='live'?'Live code':'Manual')+'</div><div class="small muted" style="margin:0 2px 2px">Tap P or A to correct a record</div>';
      h+=ros.map(function(q){return histRow(s2,q.id,q.name,q.id)}).join('');
    }
    b.innerHTML=h;b.scrollTop=top;
  }
  function histRow(s,stuId,t,sub){
    var v=s.records[stuId];
    return '<div class="hist"><div style="min-width:0"><div class="t ellipsis" style="font-weight:600">'+esc(t)+'</div><div class="small muted">'+esc(sub)+'</div></div><div class="pa" role="group" aria-label="Record for '+esc(t)+'"><button class="p'+(v==='P'?' on':'')+'" data-act="rec" data-sid="'+s.id+'" data-stu="'+stuId+'" data-v="P" aria-pressed="'+(v==='P')+'" aria-label="Present">P</button><button class="a'+(v==='A'?' on':'')+'" data-act="rec" data-sid="'+s.id+'" data-stu="'+stuId+'" data-v="A" aria-pressed="'+(v==='A')+'" aria-label="Absent">A</button></div></div>';
  }

  /* ---------------- profile ---------------- */
  function vProfile(){
    var dark=CA.theme()==='dark',cls=myClasses();
    var h='<div class="card" style="text-align:center;padding:22px 16px"><div class="avatar lg" style="margin:0 auto 12px">'+esc(CA.initials(T.name))+'</div><h2 style="font-size:20px">'+esc(T.name)+'</h2><p class="muted">'+esc(T.designation)+'</p><p class="small muted">'+esc(T.dept)+'</p><div class="summary-row" style="justify-content:center;margin:12px 0 0">'+CA.chip('neutral','ID '+T.id,'id')+CA.chip('neutral',cls.length+' classes','book')+'</div></div>';
    h+='<div class="section-title"><h2>Preferences</h2></div><div class="item"><span class="bubble">'+ic('moon')+'</span><span class="grow"><div class="t" id="dmlbl">Dark mode</div><div class="s">Easier on the eyes at night</div></span><button class="switch" role="switch" aria-checked="'+dark+'" aria-labelledby="dmlbl" data-act="theme"></button></div>';
    h+='<div class="section-title"><h2>Data</h2></div><div class="item"><span class="bubble">'+ic('shield')+'</span><span class="grow"><div class="t">Demo data</div><div class="s">Stored on this device only</div></span><button class="btn sm danger" data-act="reset">Reset</button></div>';
    h+='<button class="btn ghost" data-act="logout" style="margin-top:22px;color:var(--bad)">'+ic('logout',18)+' Sign out</button>';
    h+='<p class="small muted" style="text-align:center;margin-top:20px;line-height:1.7">CampusAttend v1.0<br>Chhatrapati Shahu Ji Maharaj University, Kanpur</p>';
    return{html:h};
  }

  /* ---------------- actions ---------------- */
  var A={
    nav:function(el){go(el.dataset.v)},
    fbclasses:function(){FBM.openClasses('classes')},fbreq:function(){FBM.openClasses('requests')},
    back:function(){go('attend')},
    pick:function(el){S.classId=el.dataset.id;render()},
    method:function(el){S.method=el.dataset.v;render()},
    start:function(){if(S.method==='live'){S.sid=CA.startLive(S.classId).id;go('live')}else startManual(S.classId)},
    'quick-live':function(el){S.classId=el.dataset.id;S.sid=CA.startLive(el.dataset.id).id;go('live')},
    'quick-manual':function(el){S.classId=el.dataset.id;startManual(el.dataset.id)},
    resume:function(el){S.sid=el.dataset.id;go('live')},
    lm:function(el){CA.setRecord(S.sid,el.dataset.id,el.dataset.v==='P'?'P':null);fillLive(true)},
    extend:function(){CA.extend(S.sid,5*60000);fillLive();CA.toast('Session extended by 5 minutes')},
    end:function(){
      var s=CA.getSession(S.sid),ros=CA.roster(s.classId),un=ros.filter(function(x){return s.records[x.id]!=='P'}).length;
      CA.dialog({title:'End this session?',body:'<p class="muted">'+(un?un+' student'+(un===1?'':'s')+' who haven’t marked will be recorded as absent.':'Everyone has marked attendance.')+' You can still correct records later from Reports.</p>',foot:'<button class="btn ghost" data-dclose>Keep open</button><button class="btn" data-act="end-ok">End and save</button>'});
    },
    'end-ok':function(){var s=CA.closeSession(S.sid);CA.closeDialog();S.rep.classId=s.classId;S.classId=s.classId;go('attend');summary(s)},
    mpa:function(el){S.m.rec[el.dataset.id]=el.dataset.v;fillManual()},
    mall:function(el){CA.roster(S.m.classId).forEach(function(s){S.m.rec[s.id]=el.dataset.v});fillManual()},
    msave:function(){
      var m=S.m,d=m.date>today()?today():m.date,s=CA.saveManual(m.classId,d,m.rec);
      S.rep.classId=m.classId;S.classId=m.classId;go('attend');summary(s,'Attendance saved');
    },
    rtab:function(el){S.rep.tab=el.dataset.v;render()},
    rlow:function(){S.rep.low=!S.rep.low;render()},
    export:function(){var c=CA.getClass(S.rep.classId);CA.download('CampusAttend_'+c.subject.replace(/\W+/g,'_')+'_'+today()+'.csv',CA.csv(c.id));CA.toast('CSV downloaded')},
    stu:function(el){S.sheet={type:'stu',id:el.dataset.id};var st=CA.db().students.find(function(x){return x.id===el.dataset.id});CA.page({title:st.name,sub:st.id+' · '+CA.cohortName(st.cohort),body:''});CA.pageBody().dataset.kind='rec';renderSheet()},
    ses:function(el){var s=CA.getSession(el.dataset.id),c=CA.getClass(s.classId);S.sheet={type:'ses',id:s.id};CA.page({title:c.subject,sub:CA.fmtDate(s.date)+' · '+CA.fmtTime(s.startedAt),body:''});CA.pageBody().dataset.kind='rec';renderSheet()},
    rec:function(el){CA.setRecord(el.dataset.sid,el.dataset.stu,el.dataset.v);renderSheet();render()},
    theme:function(){CA.setTheme(CA.theme()==='dark'?'light':'dark');render()},
    reset:function(){
      CA.dialog({title:'Reset demo data?',body:'<p class="muted">This restores the sample classes, students and attendance history. Any sessions you recorded will be removed.</p>',foot:'<button class="btn ghost" data-dclose>Cancel</button><button class="btn danger" data-act="reset-ok">Reset</button>'});
    },
    'reset-ok':function(){CA.closeDialog();CA.resetDemo();S.sid=null;S.classId=null;S.rep.classId=null;CA.toast('Demo data restored');render()},
    logout:function(){CA.logout();var go=function(){location.replace('index.html')};window.FBT?FBT.logout().then(go,go):go()}
  };
  document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=A[el.dataset.act];if(f)f(el,e)});
  document.addEventListener('input',function(e){if(e.target.id==='mq'&&S.m){S.m.q=e.target.value;fillManual()}});
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='mdate'&&S.m)S.m.date=t.value&&t.value<=today()?t.value:today();
    if(t.id==='repClass'){S.rep.classId=t.value;render()}
  });

  /* ---------------- live updates ---------------- */
  setInterval(function(){
    var ch=CA.sweep();
    if(S.view==='live'){
      var s=CA.getSession(S.sid);
      if(!s||s.status!=='open'){S.view='attend';render();if(s)summary(s,'Session ended');return}
      fillLive();
    }
    document.querySelectorAll('[data-left]').forEach(function(el){var s=CA.getSession(el.dataset.left);if(s&&s.status==='open')el.textContent=CA.mmss(s.expiresAt-Date.now())});
    if(ch&&(S.view==='home'||S.view==='attend'))render();
  },500);
  CA.onChange(function(){
    if(S.view==='live')fillLive(true);
    else if(S.view==='home'||S.view==='attend'||S.view==='reports'){render();if(S.sheet)renderSheet()}
  });

  render();
})();
</script>
</body>
</html>
