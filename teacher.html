<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CampusAttend - Teacher</title>
<style>
:root{--g:#0f4d3a;--bg:#f3f6f5;--card:#fff;--tx:#14201b;--mu:#64756e;--bd:#d6dfdb;--rd:#d93a3a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211d;--tx:#e8f0ec;--mu:#9bb0a7;--bd:#2a3833}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:20px;padding-bottom:90px}
.center{text-align:center}.logo{height:96px;width:96px;display:block;margin:0 auto}h1{margin:6px 0 0;font-size:26px}.mu{color:var(--mu);font-size:13px}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
button{width:100%;padding:13px;margin:8px 0;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:15px;font-weight:600}
button.o{background:none;color:var(--g);border:1px solid var(--g)}button.r{background:var(--rd)}button.l{background:none;color:var(--g);font-weight:500}
@media(prefers-color-scheme:dark){button.o,button.l{color:#7fd1b0;border-color:#7fd1b0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px}.row button{margin:4px 0}.seg{display:flex;gap:8px}.seg button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--g);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;background:none;color:var(--mu);margin:0;border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--g);border-top:3px solid var(--g)}
.stat{display:flex;gap:10px}.stat .card{flex:1;text-align:center}.stat b{font-size:28px;display:block}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;font-size:14px;z-index:9}
.hero{background:var(--g);color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}.hero .mu{color:#cfe8dd}.hero b{font-size:30px}.av{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:700;font-size:18px}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}.ring.low{background:conic-gradient(var(--rd) calc(var(--p)*1%),var(--bd) 0)}.ring span{background:var(--card);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto}.chips button{width:auto;padding:8px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin:4px 0}.chips button.on{background:var(--g);color:#fff}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);color:var(--tx)}.sm{width:auto;padding:8px 12px;margin:0}
</style></head><body><div id="app"></div><div id="toast"></div><script>

const SUBJ=['Mathematics','Physics','Chemistry','Programming','English'];
const ROLE='professor';const KEY='campusattend_v1';const KM='campusattend_me';const getMe=()=>localStorage.getItem(KM);const setMe=v=>v?localStorage.setItem(KM,v):localStorage.removeItem(KM);
const sha=async t=>{try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(t)}};
const load=()=>JSON.parse(localStorage.getItem(KEY)||'null');const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
let DB=load();
(async()=>{if(!DB){DB={users:[],sessions:[],records:[],me:null};save()}setTimeout(start,0)})();
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const head=()=>`<div class="center"><img class="logo" src="${LOGO}" alt="CSJMU"><h1>CampusAttend</h1><div class="mu">CSJMU Kanpur &bull; Smart Attendance System</div></div>`;
const uid=()=>Math.random().toString(36).slice(2,10);
let role='student',tab='home';
const me=()=>DB.users.find(u=>u.id==getMe());


async function ensureDemo(){const D=[['demo-t','professor','Demo Teacher','teacher@csjmu.edu','teacher123',{collegeId:'FAC001',department:'Computer Science & Engineering'}],['demo-s','student','Demo Student','student@csjmu.edu','student123',{collegeId:'CS2025001',rollNo:'2501',department:'Computer Science & Engineering',branch:'B.Tech (CSE)',year:'1st Year',semester:'1',section:'A'}]];let ch=false;
for(const [id,r,name,email,pw,x] of D)if(!DB.users.some(u=>u.id==id)){DB.users.push({id,role:r,status:'approved',name,email,pw:await sha(pw),...x,createdAt:Date.now()});ch=true}
if(!DB.tt.some(c=>c.id.startsWith('demo'))){const P=[['Mathematics','09:00','10:00','C-101'],['Physics','10:15','11:15','C-102'],['Chemistry','11:30','12:30','C-103']];
['Mon','Tue','Wed','Thu','Fri'].forEach(d=>P.forEach((p,i)=>DB.tt.push({id:'demo-'+d+i,day:d,subject:p[0],prof:'demo-t',section:'A',room:p[3],start:p[1],end:p[2]})));ch=true}
if(ch)save()}
async function start(){DB.users=DB.users.filter(u=>u.role!='admin');DB.users.forEach(u=>{if(u.role=='professor'&&u.status=='pending')u.status='approved'});DB.tt??=[];DB.audit??=[];DB.notes??=[];DB.cfg??={threshold:75};await ensureDemo();window.addEventListener('storage',()=>{DB=load();if(me()&&me().status=='approved')view()});route()}
function route(){const u=me();if(!u||u.role!=ROLE||u.status!='approved'){location.replace('index.html');return}tab='home';shell()}

function login(){app.innerHTML=`${head()}<h3>Login to your account</h3><input id="e" type="email" placeholder="College Email"><input id="p" type="password" placeholder="Password">
<button id="go">Login</button><button class="l" id="fp">Forgot Password?</button><button class="o" id="su">Create Account</button>
`;
$('#go').onclick=async()=>{const h=await sha($('#p').value),u=DB.users.find(x=>x.email==$('#e').value.trim().toLowerCase()&&x.pw==h);
if(!u)return toast('Invalid email or password');setMe(u.id);route()};$('#fp').onclick=reset;$('#su').onclick=signup}
function reset(){app.innerHTML=`${head()}<h3>Reset Password</h3><input id="e" type="email" placeholder="College Email"><input id="p" type="password" placeholder="New password (min 8)">
<button id="go">Reset</button><button class="l" id="bk">Back to Login</button><div class="mu">Demo only: no email is sent, password is changed on this device.</div>`;
$('#go').onclick=async()=>{const u=DB.users.find(x=>x.email==$('#e').value.trim().toLowerCase());if(!u||$('#p').value.length<8)return toast('Check email / password length');u.pw=await sha($('#p').value);save();toast('Password updated');login()};$('#bk').onclick=login}

const LBL={name:'Full Name',collegeId:'College ID / Faculty ID',rollNo:'Roll Number',email:'College Email',password:'Password (min 8)',department:'Department',branch:'Branch',year:'Academic Year',semester:'Semester',section:'Section',designation:'Designation (optional)'};
const FIELDS=r=>r=='student'?['name','collegeId','rollNo','email','password','department','branch','year','semester','section']:['name','collegeId','email','password','department','designation'];
const n=s=>s.trim().toUpperCase();
function signup(){app.innerHTML=`${head()}<h3>Create Account</h3><div class="seg"><button data-r="student">Student</button><button data-r="professor">Teacher</button></div><div id="f"></div><button id="go">Submit for Approval</button><button class="l" id="bk">Back to Login</button>`;
const draw=()=>{document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.r==role));$('#go').textContent=role=='student'?'Submit for Approval':'Create Account';$('#f').innerHTML=FIELDS(role).map(k=>`<input id="f_${k}" placeholder="${LBL[k]}" type="${k=='password'?'password':k=='email'?'email':'text'}">`).join('')};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{role=b.dataset.r;draw()});draw();$('#bk').onclick=login;
$('#go').onclick=async()=>{const v={};for(const k of FIELDS(role)){v[k]=$('#f_'+k).value.trim();if(!v[k]&&k!='designation')return toast(LBL[k]+' is required')}

const IC={"home": "<path d=\"m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><polyline points=\"9 22 9 12 15 12 15 22\"/>", "chart": "<line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"/><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"/>", "cal": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/>", "bell": "<path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"/><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"/>", "user": "<path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>", "target": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>", "check": "<path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"/><path d=\"m9 11 3 3L22 4\"/>", "file": "<path d=\"M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z\"/><path d=\"M14 2v6h6M16 13H8M16 17H8M10 9H8\"/>", "gear": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/>", "x": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m15 9-6 6M9 9l6 6\"/>", "ban": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m4.9 4.9 14.2 14.2\"/>", "alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/>"};const ic=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex:none">${IC[n]}</svg>`;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'],TODAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
const fmt=t=>new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const log=m=>DB.audit.unshift({at:Date.now(),m,by:me()?.name});const note=(to,m)=>DB.notes.unshift({to,m,at:Date.now()});
const TH=()=>DB.cfg.threshold;let day=TODAY=='Sun'?'Mon':TODAY;
function shell(){const r=me().role,T={student:[['home',ic('home')+'Home'],['att',ic('chart')+'Attendance'],['tt',ic('cal')+'Timetable'],['nt',ic('bell')+'Alerts'],['prof',ic('user')+'Profile']],
professor:[['home',ic('home')+'Home'],['att',ic('target')+'Session'],['tt',ic('cal')+'Timetable'],['nt',ic('bell')+'Alerts'],['prof',ic('user')+'Profile']],
admin:[['home',ic('home')+'Dashboard'],['appr',ic('check')+'Approvals'],['tt',ic('cal')+'Timetable'],['rep',ic('file')+'Reports'],['set',ic('gear')+'Settings']]}[r];
app.innerHTML=`<div id="v"></div><nav>${T.map(x=>`<button data-t="${x[0]}" class="${tab==x[0]?'on':''}">${x[1]}</button>`).join('')}</nav>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});view()}
function view(){if(!$('#v'))return;const r=me().role;({home,appr,att:r=='student'?stuAtt:profSess,tt,nt,prof,rep,set:setg}[tab])()}
const ring=pc=>pc==null?'<div class="ring" style="--p:0"><span>--</span></div>':`<div class="ring ${pc<TH()?'low':''}" style="--p:${pc}"><span>${pc}%</span></div>`;
const need=(p,t)=>{const th=TH();return th>=100?0:Math.max(0,Math.ceil((th*t-100*p)/(100-th)))};
function stats(u){return SUBJ.map(s=>{const ses=DB.sessions.filter(x=>x.subject==s&&x.section==u.section),pr=ses.filter(x=>DB.records.some(r=>r.sid==x.id&&r.uid==u.id)).length;return{s,t:ses.length,p:pr,pc:ses.length?Math.round(pr/ses.length*100):null}})}
const hero=(u,inner)=>`<div class="hero"><div class="sp"><div><div class="mu">Welcome back</div><h2 style="margin:2px 0">${esc(u.name)}</h2><div class="mu">${u.role=='professor'?'teacher':u.role}${u.branch?' &bull; '+esc(u.branch)+' Sec '+esc(u.section):''}</div></div><div class="av">${esc(u.name[0]).toUpperCase()}</div></div>${inner||''}</div>`;
const clsList=L=>L.length?L.map(c=>`<div class="card sp"><div><b>${esc(c.subject)}</b><div class="mu">${esc(c.start)} - ${esc(c.end)} &bull; Room ${esc(c.room)} &bull; Sec ${esc(c.section)}</div></div></div>`).join(''):'<div class="card mu">No classes scheduled.</div>';
const myTT=u=>DB.tt.filter(c=>u.role=='student'?c.section==u.section:u.role=='professor'?c.prof==u.id:true).sort((a,b)=>a.start.localeCompare(b.start));

function home(){const u=me();let h='';
if(0){}
else if(u.role=='student'){const st=stats(u),T=st.reduce((a,x)=>a+x.t,0),P=st.reduce((a,x)=>a+x.p,0),pc=T?Math.round(P/T*100):null;
h=hero(u,`<div class="sp" style="margin-top:10px"><div><div class="mu">Attendance</div><b>${pc==null?'--':pc+'%'}</b></div><div><div class="mu">Shortage</div><b>${pc==null?'--':Math.max(0,TH()-pc)+'%'}</b></div></div>`)+(pc!=null&&pc<TH()?`<div class="card" style="border-color:var(--rd)">${ic('alert',18)} Attendance is below ${TH()}%. Attend ${need(P,T)} more class(es) in a row to reach ${TH()}%.</div>`:'')+
`<div class="card"><b>Mark attendance</b><input id="code" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit class code"><button id="mk">Submit Code</button></div><h3>Today's Classes (${TODAY})</h3>${clsList(myTT(u).filter(c=>c.day==TODAY))}`}
else{const act=DB.sessions.find(x=>x.open&&x.by==u.id);h=hero(u)+`<div class="stat"><div class="card"><b>${DB.users.filter(x=>x.role=='student'&&x.status=='pending').length}</b>Pending</div><div class="card"><b>${DB.users.filter(x=>x.role=='student'&&x.status=='approved').length}</b>Students</div></div>`+(act?`<div class="card sp"><div><b>Live: ${act.subject} (Sec ${esc(act.section)})</b><div class="mu">Code ${act.code}</div></div><button class="sm" onclick="tab='att';shell()">Open</button></div>`:'')+`<h3>Today's Classes (${TODAY})</h3>${clsList(myTT(u).filter(c=>c.day==TODAY))}<h3>My Subjects</h3>${[...new Set(myTT(u).map(c=>c.subject+' - Sec '+c.section))].map(x=>`<div class="card">${esc(x)}</div>`).join('')||'<div class="mu">Subjects appear once the admin assigns you a timetable.</div>'}`}
$('#v').innerHTML=h;if($('#mk'))$('#mk').onclick=mark}
function mark(){const u=me(),c=$('#code').value.trim(),s=DB.sessions.find(x=>x.open&&x.code==c&&x.section==u.section);
if(!s)return toast('Invalid or expired code');if(DB.records.some(r=>r.sid==s.id&&r.uid==u.id))return toast('Already marked for this session');
DB.records.push({sid:s.id,uid:u.id,status:'present',at:Date.now(),mode:'self'});note(u.id,'Attendance marked: '+s.subject);save();toast('Attendance marked: '+s.subject);home()}
function stuAtt(){const u=me(),st=stats(u),rec=DB.records.filter(r=>r.uid==u.id).sort((a,b)=>b.at-a.at).slice(0,10);
$('#v').innerHTML=`<h2>Attendance History</h2>`+st.map(x=>`<div class="card sp">${ring(x.pc)}<div style="flex:1"><b>${x.s}</b><div class="mu">Present: ${x.p} / Total: ${x.t}</div>${x.pc!=null&&x.pc<TH()?`<div class="mu" style="color:var(--rd)">Need ${need(x.p,x.t)} more consecutive class(es) for ${TH()}%</div>`:''}</div></div>`).join('')+
`<div class="mu">Forecast assumes you attend every upcoming class.</div><h3>Recent</h3>`+(rec.map(r=>{const s=DB.sessions.find(x=>x.id==r.sid);return `<div class="card sp"><div><b>${esc(s?.subject)}</b><div class="mu">${fmt(r.at)}</div></div><span class="tag">${r.mode=='manual'?'Manual':'Self check-in'}</span></div>`}).join('')||'<div class="mu">No records yet.</div>')}

function profSess(){const u=me(),act=DB.sessions.find(x=>x.open&&x.by==u.id);
if(!act){const subs=[...new Set(myTT(u).map(c=>c.subject))],opts=(subs.length?subs:SUBJ).map(s=>`<option>${s}</option>`).join('');
$('#v').innerHTML=`<h2>Start Attendance</h2><select id="sb">${opts}</select><input id="sc" placeholder="Section (e.g. A)"><button id="go">Start Session</button>`;
$('#go').onclick=()=>{const sec=$('#sc').value.trim();if(!sec)return toast('Section required');const s={id:uid(),subject:$('#sb').value,section:sec,code:gen(),open:true,by:u.id,start:Date.now()};DB.sessions.push(s);log('Session started: '+s.subject+' Sec '+sec);save();profSess()};return}
const secSt=DB.users.filter(x=>x.role=='student'&&x.status=='approved'&&x.section==act.section),pr=DB.records.filter(r=>r.sid==act.id);
$('#v').innerHTML=`<h2>Live Session</h2><div class="card center"><div class="mu">${act.subject} - Sec ${esc(act.section)}</div><div style="font-size:42px;letter-spacing:6px;font-weight:700">${act.code}</div></div>
<div class="stat"><div class="card"><b>${pr.length}</b>Present</div><div class="card"><b>${Math.max(secSt.length-pr.length,0)}</b>Absent</div></div>
<div class="row"><button class="o" id="rc">Rotate Code</button><button class="r" id="en">End Session</button></div>
${secSt.map(s=>{const p=pr.some(r=>r.uid==s.id);return `<div class="card sp"><span>${esc(s.name)} <span class="mu">${esc(s.rollNo)}</span></span><button class="sm" style="background:${p?'var(--g)':'var(--rd)'}" data-u="${s.id}">${p?'Present':'Absent'}</button></div>`}).join('')}
<div class="mu">Tap to toggle manually (saved as a manual entry in the audit log).</div>`;
$('#rc').onclick=()=>{act.code=gen();save();profSess()};$('#en').onclick=()=>{if(confirm('End this session?')){act.open=false;log('Session ended: '+act.subject+' ('+pr.length+' present)');save();profSess()}};
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=DB.records.findIndex(r=>r.sid==act.id&&r.uid==b.dataset.u),st=DB.users.find(x=>x.id==b.dataset.u);if(i>=0)DB.records.splice(i,1);else DB.records.push({sid:act.id,uid:b.dataset.u,status:'present',at:Date.now(),mode:'manual'});log('Manual change: '+st.name+' in '+act.subject+' -> '+(i>=0?'absent':'present'));save();profSess()})}
const gen=()=>String(Math.floor(100000+Math.random()*900000));
const ov=(a,b,c,d)=>a<d&&c<b;
function tt(){const u=me(),adm=u.role=='professor';
let h=`<h2>Timetable</h2><div class="chips">${DAYS.map(d=>`<button data-d="${d}" class="${d==day?'on':''}">${d}</button>`).join('')}</div>`;
const L=myTT(u).filter(c=>c.day==day);
h+=L.length?L.map(c=>`<div class="card sp"><div><b>${esc(c.subject)}</b><div class="mu">${esc(c.start)} - ${esc(c.end)} &bull; Room ${esc(c.room)} &bull; Sec ${esc(c.section)}</div></div>${adm?`<button class="sm r" data-x="${c.id}">Delete</button>`:''}</div>`).join(''):'<div class="card mu">No classes on '+day+'.</div>';
if(adm)h+=`<h3>Add Schedule</h3><select id="a_s">${SUBJ.map(s=>`<option>${s}</option>`).join('')}</select><input id="a_c" placeholder="Section (e.g. A)"><input id="a_r" placeholder="Room (e.g. C-101)"><div class="row"><input id="a_a" type="time"><input id="a_b" type="time"></div><button id="a_go">Save Schedule (${day})</button>`;
$('#v').innerHTML=h;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{day=b.dataset.d;tt()});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Delete this class?')){DB.tt=DB.tt.filter(c=>c.id!=b.dataset.x);log('Schedule deleted');save();tt()}});
if(adm)$('#a_go').onclick=()=>{const c={id:uid(),day,subject:$('#a_s').value,prof:u.id,section:$('#a_c').value.trim(),room:$('#a_r').value.trim(),start:$('#a_a').value,end:$('#a_b').value};
if(!c.prof||!c.section||!c.room||!c.start||!c.end||c.start>=c.end)return toast('Fill all fields (end after start)');
if(DB.tt.some(x=>x.day==day&&ov(x.start,x.end,c.start,c.end)&&(x.section==c.section||x.prof==c.prof||x.room==c.room)))return toast('Conflict: section, professor or room is busy');
DB.tt.push(c);log('Schedule added: '+c.subject+' '+day+' '+c.start);save();tt()}}
function nt(){const L=DB.notes.filter(x=>x.to==getMe()).slice(0,30),u=me(),w=u.role=='student'?stats(u).filter(x=>x.pc!=null&&x.pc<TH()):[];
$('#v').innerHTML=`<h2>Notifications</h2>`+w.map(x=>`<div class="card" style="border-color:var(--rd)">${ic('alert',18)} Attendance in ${x.s} is below ${TH()}% (${x.pc}%)</div>`).join('')+(L.map(x=>`<div class="card">${esc(x.m)}<div class="mu">${fmt(x.at)}</div></div>`).join('')||(w.length?'':'<div class="mu">No notifications.</div>'))}

const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='attendance_report.csv';a.click()}}

document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d,u=DB.users.find(x=>x.id==d.slice(1)),ok=d[0]=='a';if(confirm((ok?'Approve ':'Reject ')+u.name+'?')){u.status=ok?'approved':'rejected';log((ok?'Approved ':'Rejected ')+u.name+' ('+u.role+')');note(u.id,ok?'Your registration was approved.':'Your registration was rejected.');save();appr()}})}
