<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c5ce7"><title>CampusAttend</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f2ff;--card:#fff;--tx:#1e1b3a;--mu:#7a7899;--bd:#e8e5fa;--pr:#6c5ce7;--ok:#10b981;--okb:#d1fae5;--er:#ef4444;--erb:#fee2e2;--wa:#f59e0b;--wab:#fef3c7;--sh:0 4px 20px rgba(108,92,231,.10);--g:linear-gradient(135deg,#6c5ce7,#a855f7 60%,#ec4899)}
@media(prefers-color-scheme:dark){:root{--bg:#0d0b1e;--card:#171433;--tx:#ecebff;--mu:#9b98c4;--bd:#27234d;--okb:#0b3326;--erb:#3b1220;--wab:#3a2a08;--sh:0 4px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.mainc{padding:0 16px 100px}.wrap{max-width:560px;margin:auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06)}.tabbar .lg{display:none}
.tabbar button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px Inter,system-ui;padding:6px;border-radius:12px;cursor:pointer;position:relative}.tabbar button.on{color:var(--pr)}
.tabbar b{position:absolute;top:0;right:22%;background:var(--er);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}
.view{display:none}.view.on{display:block;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.hero{background:var(--g);color:#fff;border-radius:0 0 28px 28px;margin:0 -16px;padding:30px 20px 60px;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0;font-size:24px}.hero small,.hero p{opacity:.9;margin:0}.pull{margin-top:-40px}
.av{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--bd)}.card h3{margin:0 0 12px;font-size:16px}h2{font-size:20px;margin:22px 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:14px}.grid .card{margin:0}
.stat{display:flex;flex-direction:column;gap:4px}.stat b{font-size:28px;line-height:1.1}.mu,.stat span{color:var(--mu);font-size:13px}
.ico{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:rgba(108,92,231,.14);color:var(--pr)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 4px}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;margin:0 0 12px;outline:0}input:focus,select:focus{border-color:var(--pr)}
.otp{font:700 30px ui-monospace,monospace;text-align:center;letter-spacing:12px}
.btn{padding:13px 18px;border:0;border-radius:14px;background:var(--g);color:#fff;font:600 15px Inter,system-ui;cursor:pointer;box-shadow:0 6px 16px rgba(108,92,231,.3)}.btn:active{transform:scale(.98)}.btn.ok{background:var(--ok);box-shadow:none}.btn.er{background:var(--er);box-shadow:none}.btn.gh{background:var(--bg);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}.btn.w{width:100%}.btn.s{padding:7px 13px;font-size:13px;border-radius:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okb);color:var(--ok);white-space:nowrap}.tag.er{background:var(--erb);color:var(--er)}.tag.wa{background:var(--wab);color:var(--wa)}.tag.pr{background:rgba(108,92,231,.15);color:var(--pr)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.live{background:var(--g);color:#fff;text-align:center;border:0}.live .code{font:800 54px ui-monospace,monospace;letter-spacing:12px;margin:8px 0}.pulse{display:inline-flex;align-items:center;gap:6px;font-weight:600}.pulse:before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:p 1.2s infinite}@keyframes p{50%{opacity:.2}}
.empty{text-align:center;color:var(--mu);padding:22px}.alert{background:var(--erb);color:var(--er);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:500}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e1b3a;color:#fff;padding:11px 20px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:99;font-weight:500}#toast.on{opacity:1}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;flex:1;padding:24px 20px 40px}.sheet .in{max-width:420px;margin:auto}.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:18px;border:1px solid var(--bd)}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font:600 14px Inter,system-ui;color:var(--mu);cursor:pointer}.tabs .on{background:var(--g);color:#fff}
@media(min-width:900px){.mainc{margin-left:230px;padding:0 32px 32px}.wrap{max-width:820px}.hero{margin:0 -32px}.tabbar{top:0;right:auto;width:230px;flex-direction:column;padding:20px 12px;border-top:0;border-right:1px solid var(--bd);box-shadow:none;gap:4px}.tabbar .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:0 8px 20px}.tabbar button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:12px 14px;justify-content:flex-start}.tabbar button.on{background:rgba(108,92,231,.12)}.tabbar b{position:static;margin-left:auto}#toast{bottom:30px}}
</style></head><body>
<div class="mainc"><div class="wrap"><section class="view" id="v-home">
<div class="hero"><div><small id="gr"></small><h1>Hi, <span id="hi"></span> 👋</h1><p>Your attendance at a glance</p></div><div class="av" id="av"></div></div>
<div class="pull"><div class="card" style="display:flex;align-items:center;gap:16px"><div id="ring"></div><div><b style="font-size:17px">Overall attendance</b><div class="mu" id="ovt"></div></div></div></div><div id="warn"></div><h2 style="margin-top:6px">Subjects</h2><div id="sum"></div></section>
<section class="view" id="v-att"><h2>Mark attendance</h2><div class="card"><label>Subject</label><select id="sub"></select><label>Class code</label><input id="cd" class="otp" inputmode="numeric" maxlength="6" placeholder="······"><button id="go_" class="btn w">Submit attendance</button></div><p class="mu" style="text-align:center">Ask your professor for the live 6-digit code.</p></section>
<section class="view" id="v-pf"><h2>Profile</h2><div id="pf"></div></section></div></div><nav id="nav" class="tabbar"></nav><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
// TODO: paste YOUR Firebase web config here
firebase.initializeApp({apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",appId:"YOUR_APP_ID"});
const A=firebase.auth(),D=firebase.firestore(),$=s=>document.querySelector(s),TS=firebase.firestore.FieldValue.serverTimestamp();
const e=s=>String(s??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const toast=t=>{const x=$("#toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2600)};
const hash=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const IC={home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',check:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14l-3-3"/>',chart:'<path d="M12 20V10M18 20V4M6 20v-4"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/>',live:'<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.5M7.8 16.2a6 6 0 0 1 0-8.4M19 4.9a10 10 0 0 1 0 14.2M5 19.1a10 10 0 0 1 0-14.2"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+IC[n]+'</svg>';
const go=id=>{document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id=="v-"+id));document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.id=="t-"+id));scrollTo(0,0)};
const shell=it=>{$("#nav").innerHTML='<div class="lg"><span class="ico">'+ic("check")+'</span>CampusAttend</div>'+it.map(x=>'<button id="t-'+x[0]+'" onclick="go(\''+x[0]+'\')">'+ic(x[2])+x[1]+'</button>').join("");go(it[0][0])};
const out=()=>A.signOut().then(()=>location="index.html");
const prof=d=>$("#pf").innerHTML='<div class="card" style="text-align:center"><div class="av" style="margin:auto;background:var(--g);width:76px;height:76px;font-size:30px">'+e(d.name[0])+'</div><h2 style="margin:12px 0 2px">'+e(d.name)+'</h2><div class="mu">'+e(d.email)+'</div><p><span class="tag pr">'+({student:"Student",teacher:"Professor",admin:"Admin"})[d.role]+'</span> <span class="tag">ID '+e(d.idNo||"-")+'</span>'+(d.section?' <span class="tag wa">'+e(d.section)+'</span>':'')+'</p></div><button class="btn er w" onclick="out()">'+ic("out")+' Logout</button>';
const guard=(role,cb)=>A.onAuthStateChanged(async u=>{if(!u)return location="index.html";const d=(await D.doc("users/"+u.uid).get()).data();if(!d||d.role!==role||d.status!=="approved")return location="index.html";
const h=new Date().getHours();$("#gr").textContent=h<12?"Good morning":h<17?"Good afternoon":"Good evening";$("#hi").textContent=d.name.split(" ")[0];$("#av").textContent=d.name[0].toUpperCase();prof(d);cb(u,d)});
let me,pf,TH=75;shell([["home","Home","home"],["att","Attend","check"],["pf","Profile","user"]]);
const ring=(p,c)=>'<svg width="112" height="112" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="'+c+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+2.64*p+' 264" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">'+Math.round(p)+'%</text></svg>';
guard("student",async(u,d)=>{me=u;pf=d;const t=await D.doc("settings/main").get();if(t.exists)TH=t.data().threshold;load()});
async function load(){const sb=await D.collection("subjects").where("section","==",pf.section).get();
$("#sub").innerHTML=sb.docs.map(d=>'<option value="'+d.id+'">'+e(d.data().name)+'</option>').join("")||'<option value="">No subjects</option>';
const R=(await D.collection("records").where("uid","==",me.uid).get()).docs.map(d=>d.data());let h="",w="",tc=0,tp=0;
for(const s of sb.docs){const c=(await D.collection("sessions").where("subjectId","==",s.id).get()).size,p=R.filter(r=>r.subjectId==s.id).length,pc=c?p/c*100:0,low=c&&pc<TH;tc+=c;tp+=p;
if(low)w+='<div class="alert">⚠ '+e(s.data().name)+' is below '+TH+'%. Attend the next '+Math.ceil((TH*c-100*p)/(100-TH))+' class(es) in a row to reach it.</div>';
h+='<div class="card"><div class="row" style="border:0;padding:0"><b>'+e(s.data().name)+'</b><span class="tag '+(low?'er':'')+'">'+pc.toFixed(1)+'%</span></div><div class="bar"><i style="width:'+pc+'%;background:'+(low?'var(--er)':'var(--ok)')+'"></i></div><span class="mu">'+p+' present of '+c+' classes</span></div>'}
$("#sum").innerHTML=h||'<div class="card empty">No subjects for your section yet</div>';$("#warn").innerHTML=w;
const o=tc?tp/tc*100:0;$("#ring").innerHTML=ring(o,tc&&o<TH?"#ef4444":"#10b981");$("#ovt").textContent=tp+" of "+tc+" classes · minimum "+TH+"%"}
$("#go_").onclick=async()=>{const s=$("#sub").value,c=$("#cd").value.trim();
if(!s)return toast("No subject selected");if(!/^\d{6}$/.test(c))return toast("Enter the 6-digit code");
try{const q=await D.collection("sessions").where("subjectId","==",s).where("status","==","open").get();
if(q.empty)return toast("No open session for this subject");
const ses=q.docs[0];if((await hash(c))!=ses.data().codeHash)return toast("Invalid or expired code");
const ref=D.doc("records/"+ses.id+"_"+me.uid);
await D.runTransaction(async t=>{if((await t.get(ref)).exists)throw Error("Already marked for this session");t.set(ref,{sessionId:ses.id,subjectId:s,uid:me.uid,name:pf.name,status:"present",method:"self-checkin",at:TS})});
toast("Attendance marked ✓");$("#cd").value="";load();go("home")}catch(x){toast(x.message)}};
</script></body></html>
