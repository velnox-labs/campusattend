<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusAttend - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>body{font-family:\'Poppins\',sans-serif}</style>
</head>
<body class="bg-[#F3F4FF] min-h-screen flex justify-center">
<div class="w-full max-w-[430px] bg-white min-h-screen shadow-xl flex flex-col">
    <!-- Top Gradient -->
    <div class="bg-gradient-to-br from-indigo-600 to-violet-600 pt-12 pb-10 px-6 rounded-b-[40px] text-white text-center">
        <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-600 text-2xl">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="text-2xl font-bold">CampusAttend</h1>
        <p class="text-sm text-indigo-100 mt-1">College Attendance System</p>
    </div>

    <!-- Login Card -->
    <div class="px-6 -mt-6">
        <div class="bg-white rounded-[24px] shadow-lg p-6 border">
            <h2 class="text-xl font-semibold text-center">Welcome Back</h2>
            <p class="text-sm text-gray-500 text-center mb-6">Login to continue</p>
            
            <label class="text-sm font-medium">Email</label>
            <div class="relative mt-1 mb-4">
                <i class="fa-regular fa-envelope absolute left-3 top-3.5 text-gray-400"></i>
                <input id="email" type="email" placeholder="admin@campus.com" class="w-full pl-10 pr-4 py-3 bg-gray-50 border rounded-xl outline-none focus:border-indigo-500">
            </div>

            <label class="text-sm font-medium">Password</label>
            <div class="relative mt-1 mb-2">
                <i class="fa-solid fa-lock absolute left-3 top-3.5 text-gray-400"></i>
                <input id="password" type="password" placeholder="••••••••" class="w-full pl-10 pr-10 py-3 bg-gray-50 border rounded-xl outline-none focus:border-indigo-500">
                <i id="eye" class="fa-regular fa-eye absolute right-3 top-3.5 text-gray-400 cursor-pointer" onclick="togglePass()"></i>
            </div>
            <div class="text-right mb-6"><a href="#" class="text-xs text-indigo-600">Forgot Password?</a></div>

            <button onclick="login()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-indigo-200 hover:bg-indigo-700">Login <i class="fa-solid fa-arrow-right ml-2"></i></button>
            <p id="error" class="text-red-500 text-sm text-center mt-3 hidden">Galat Email ya Password!</p>
        </div>

        <!-- Demo Accounts -->
        <div class="bg-indigo-50 rounded-2xl p-4 mt-6">
            <p class="text-xs font-semibold text-indigo-700 mb-2"><i class="fa-solid fa-circle-info mr-1"></i> Demo Accounts - Click to fill</p>
            <div onclick="fill(\'admin@campus.com\',\'admin123\')" class="bg-white p-3 rounded-xl flex justify-between items-center mb-2 cursor-pointer border hover:border-indigo-300">
                <div><p class="text-sm font-semibold">Admin</p><p class="text-xs text-gray-500">admin@campus.com</p></div><span class="text-xs bg-indigo-600 text-white px-3 py-1 rounded-full">Admin</span>
            </div>
            <div onclick="fill(\'teacher@campus.com\',\'teacher123\')" class="bg-white p-3 rounded-xl flex justify-between items-center mb-2 cursor-pointer border hover:border-indigo-300">
                <div><p class="text-sm font-semibold">Teacher</p><p class="text-xs text-gray-500">teacher@campus.com</p></div><span class="text-xs bg-emerald-500 text-white px-3 py-1 rounded-full">Teacher</span>
            </div>
            <div onclick="fill(\'student@campus.com\',\'student123\')" class="bg-white p-3 rounded-xl flex justify-between items-center cursor-pointer border hover:border-indigo-300">
                <div><p class="text-sm font-semibold">Student</p><p class="text-xs text-gray-500">student@campus.com</p></div><span class="text-xs bg-orange-500 text-white px-3 py-1 rounded-full">Student</span>
            </div>
        </div>
    </div>
    <p class="text-center text-xs text-gray-400 mt-auto py-6">© 2024 CampusAttend. All rights reserved.</p>
</div>

<script>
function fill(e,p){document.getElementById(\'email\').value=e; document.getElementById(\'password\').value=p;}
function togglePass(){let i=document.getElementById(\'password\');i.type=i.type===\'password\'?\'text\':\'password\';}
function login(){
    let e=document.getElementById(\'email\').value.trim();
    let p=document.getElementById(\'password\').value.trim();
    let err=document.getElementById(\'error\');
    if(e===\'admin@campus.com\' && p===\'admin123\'){localStorage.setItem(\'role\',\'admin\'); location.href=\'admin.html\';}
    else if(e===\'teacher@campus.com\' && p===\'teacher123\'){localStorage.setItem(\'role\',\'teacher\'); location.href=\'teacher.html\';}
    else if(e===\'student@campus.com\' && p===\'student123\'){localStorage.setItem(\'role\',\'student\'); location.href=\'student.html\';}
    else{err.classList.remove(\'hidden\');}
}
</script>
</body>
</html>
